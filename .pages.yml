# Eingabemaske für Pages CMS (app.pagescms.org)
media:
  input: bilder
  output: bilder

content:
  - name: fundstuecke
    label: Fundstücke
    type: collection
    path: fundstuecke
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, rarity, value]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: image
        label: Bild
        type: image
        required: true
        description: Am besten PNG oder WebP mit transparentem Hintergrund, etwa 800 × 800 Pixel.
        options:
          extensions: [png, webp, jpg, jpeg, gif, svg]
          rename: safe
      - name: rarity
        label: Seltenheit
        type: select
        required: true
        options:
          values:
            - name: gewoehnlich
              label: Gewöhnlich
            - name: ungewoehnlich
              label: Ungewöhnlich
            - name: selten
              label: Selten
            - name: episch
              label: Episch
            - name: legendaer
              label: Legendär
            - name: mythisch
              label: Mythisch
      - name: haeufigkeit
        label: Häufigkeit
        type: select
        description: Macht das Stück innerhalb seiner Seltenheit seltener. Leer lassen = normal. Der Wert hat keinen Einfluss auf die Chance.
        options:
          values:
            - name: normal
              label: Normal
            - name: seltener
              label: Seltener (halb so oft)
            - name: deutlich-seltener
              label: Deutlich seltener (ein Viertel so oft)
            - name: sehr-selten
              label: Sehr selten (ein Zehntel so oft)
      - name: value
        label: Wert in Euro
        type: number
        description: Bei „Mythisch“ zeigt die App „Unbezahlbar“ an.
      - name: text
        label: Beschreibung
        type: text
        description: Ein, zwei Sätze für das Museumsschild.
      - name: nr
        label: Inventarnummer
        type: number
        description: Leer lassen, dann vergibt die App die nächste freie Nummer.

  - name: abzeichen
    label: Abzeichen
    type: collection
    path: abzeichen
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, fund1, fund2]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: image
        label: Bild (farbig)
        type: image
        required: true
        description: Rundes Abzeichen, am besten PNG mit transparentem Hintergrund. Erscheint nach der richtigen Kombination.
        options:
          extensions: [png, webp, jpg, jpeg, svg]
          rename: safe
      - name: image_grau
        label: Bild (ausgegraut)
        type: image
        description: Ist in der Werkstatt immer zu sehen, solange das Abzeichen noch nicht entdeckt ist. Leer lassen = die App macht das farbige Bild grau.
        options:
          extensions: [png, webp, jpg, jpeg, svg]
          rename: safe
      - name: fund1
        label: Fundstück 1
        type: reference
        required: true
        options:
          collection: fundstuecke
          value: "{path}"
          label: "{name}"
          search: name
      - name: fund2
        label: Fundstück 2
        type: reference
        required: true
        options:
          collection: fundstuecke
          value: "{path}"
          label: "{name}"
          search: name
      - name: raetsel
        label: Rätsel (Französisch)
        type: text
        required: true
        description: Erscheint als Hinweis, sobald jemand beide Fundstücke besitzt. Am besten mit Wörtern aus der App.
