/* ---------------- Lernkartei (Leitner, Fach 1–5) ---------------- */
const INTERVAL = [0, 1, 2, 4, 8, 16];
const W = () => save.learn.w;
function introduced() { return WORDS.filter(w => W()[w.id]); }
function pickNew(n, exclude) {
  const out = [];
  for (const w of WORDS) { if (out.length >= n) break; if (!W()[w.id] && !(exclude && exclude.has(w.id))) out.push(w.id); }
  return out;
}
function applyResult(id, ok) {
  const t = today();
  let st = W()[id];
  if (!st) st = W()[id] = { b: 0, due: t, last: -9, lastBad: -9, intro: t, ok: 0, bad: 0 };
  const first = st.last !== t;
  if (ok) {
    st.ok++;
    if (st.b === 0) { st.b = 1; st.due = t + 1; }
    else if (first) { st.due = t + (st.b === 5 ? 32 : INTERVAL[st.b + 1]); st.b = Math.min(5, st.b + 1); }
  } else { st.bad++; st.b = 1; st.due = t + 1; st.lastBad = t; }
  st.last = t;
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const randDir = () => rand() < .5 ? "fr2de" : "de2fr";
function makeQs(mcIds, writeIds) {
  const qs = shuffle([...mcIds.map(w => ({ w, t: "mc" })), ...writeIds.map(w => ({ w, t: "write" }))]);
  // Ein Wort erst auswählen, dann schreiben
  for (let i = 0; i < qs.length; i++) if (qs[i].t === "write") {
    const j = qs.findIndex((q, k) => k > i && q.t === "mc" && q.w === qs[i].w);
    if (j > i) [qs[i], qs[j]] = [qs[j], qs[i]];
  }
  // Gleiches Wort nicht direkt hintereinander (wenn möglich)
  for (let i = 1; i < qs.length; i++) if (qs[i].w === qs[i - 1].w) {
    const j = qs.findIndex((q, k) => k > i && q.w !== qs[i - 1].w && !(q.t === "write" && qs.slice(0, i).every(p => p.w !== q.w) && mcIds.includes(q.w)));
    if (j > i) { const [q] = qs.splice(j, 1); qs.splice(i, 0, q); }
  }
  for (const q of qs) { q.d = randDir(); if (q.t === "mc") q.opts = makeOptions(q.w, q.d); }
  return qs;
}
function makeOptions(id, d) {
  const w = WORD[id], side = d === "fr2de" ? "de" : "fr";
  // Keine Ablenker, die eine Bedeutung mit dem Zielwort (oder untereinander) teilen
  const keys = x => [...alts(x.fr), ...alts(x.de)].map(k => { const l = looseKey(k); return splitArt(l, "de").core.replace(/^(le|la|les) |^l'/, ""); });
  const taken = new Set(keys(w));
  const pick = list => { const out = []; for (const x of shuffle(list.slice())) { if (out.length >= 3) break; const ks = keys(x); if (x.id !== id && !ks.some(k => taken.has(k))) { ks.forEach(k => taken.add(k)); out.push(x.id); } } return out; };
  let opts = pick(WORDS.filter(x => x.theme === w.theme));
  if (opts.length < 3) opts = opts.concat(pick(WORDS.filter(x => !opts.includes(x.id)))).slice(0, 3);
  return shuffle([id, ...opts]);
}

function buildDaily() {
  const t = today();
  const known = introduced().map(w => w.id).filter(id => W()[id].b >= 1);
  const due = known.filter(id => W()[id].due <= t).sort((a, b) => W()[a].b - W()[b].b || W()[a].due - W()[b].due);
  const notDue = known.filter(id => W()[id].due > t).sort((a, b) => W()[a].due - W()[b].due || W()[a].b - W()[b].b);
  const nNew = known.length === 0 ? 5 : due.length >= 8 ? 1 : due.length >= 5 ? 2 : 3;
  const fresh = pickNew(nNew);
  const review = [...due, ...notDue];
  const writes = review.slice(0, 5);
  const mcs = fresh.slice(0, 5);
  let ri = writes.length;
  while (mcs.length < 5 && ri < review.length) mcs.push(review[ri++]);
  // noch Platz: bekannte Wörter dürfen in derselben Runde auch gewählt werden
  for (let k = 0; mcs.length < 5 && k < writes.length; k++) if (!mcs.includes(writes[k])) mcs.push(writes[k]);
  if (mcs.length < 5) { const more = pickNew(5 - mcs.length, new Set(fresh)); mcs.push(...more); fresh.push(...more); }
  for (let k = 0; writes.length < 5 && fresh.length; k++) writes.push(fresh[k % fresh.length]);
  const all = WORDS.map(w => w.id);
  while (mcs.length < 5) mcs.push(all[Math.floor(rand() * all.length)]);
  while (writes.length < 5) writes.push(mcs[writes.length % mcs.length]);
  return { kind: "daily", day: t, mult: multFor(streakForToday()), qs: makeQs(mcs, writes), i: 0, ans: [], earned: 0 };
}
function buildPractice() {
  const t = today();
  const intro = introduced().map(w => w.id);
  const st = id => W()[id];
  const order = [
    ...intro.filter(id => st(id).lastBad === t),
    ...intro.filter(id => st(id).intro === t && st(id).lastBad !== t),
    ...intro.filter(id => st(id).last === t && st(id).intro !== t && st(id).lastBad !== t),
    ...intro.filter(id => st(id).last !== t).sort((a, b) => st(a).b - st(b).b || st(a).due - st(b).due)
  ];
  const ids = [...new Set(order)].slice(0, 10);
  while (ids.length < 10 && ids.length) ids.push(ids[ids.length % Math.max(1, new Set(ids).size)]);
  const half = shuffle(ids.slice());
  return { kind: "practice", day: t, mult: 1, qs: makeQs(half.slice(0, 5), half.slice(5, 10)), i: 0, ans: [], earned: 0 };
}

/* ---------------- Antworten prüfen ---------------- */
const FR_ART = /^(le|la|les)\s+|^l'\s*|^l\s+/;
const DE_ART = /^(der|die|das)\s+/;
function strictKey(s) {
  return String(s).toLowerCase().replace(/\(.*?\)/g, " ").replace(/[’`´]/g, "'")
    .replace(/[?!.,;:¿¡"«»]/g, " ").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim();
}
function looseKey(s) {
  return strictKey(s).replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/-/g, " ");
}
const alts = s => String(s).split(" / ").map(x => x.trim()).filter(Boolean);
const display = s => alts(s).join(" / ");
const firstAlt = s => alts(s)[0].replace(/\s*\(.*?\)\s*/g, " ").trim();
function splitArt(k, lang) {
  const re = lang === "fr" ? FR_ART : DE_ART;
  const m = k.match(re);
  if (!m) return { art: "", core: k };
  const core = k.slice(m[0].length);
  return core ? { art: m[0].trim(), core } : { art: "", core: k };
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  const dp = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= b.length; j++) { const tmp = dp[j]; dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return dp[b.length];
}
// Ergebnis: { ok, hint }
function checkWrite(word, dir, input) {
  const lang = dir === "fr2de" ? "de" : "fr";
  const target = word[lang];
  const inS = strictKey(input), inL = looseKey(input);
  if (!inS) return { ok: false, hint: "" };
  const inA = splitArt(inS, lang), inAL = splitArt(inL, lang);
  let best = null;
  for (const alt of alts(target)) {
    const aS = strictKey(alt), aL = looseKey(alt);
    const tA = splitArt(aS, lang), tAL = splitArt(aL, lang);
    const shown = alt.replace(/\s*\(.*?\)\s*/g, " ").trim();
    if (inS === aS) return { ok: true, hint: "" };
    const artWrong = inA.art && tA.art && inA.art !== tA.art;
    const artMissing = !inA.art && tA.art;
    const coreExact = inA.core === tA.core, coreLoose = inAL.core === tAL.core;
    const typo = !coreLoose && tAL.core.length >= 5 && lev(inAL.core, tAL.core) <= 1;
    if (coreExact || coreLoose || typo) {
      if (artWrong && lang === "fr") { best = best || { ok: false, hint: `Fast! Der Artikel ist „${tA.art === "l'" ? "l’" : tA.art}“: ${shown}` }; continue; }
      const notes = [];
      if (typo) notes.push("kleiner Tippfehler");
      else if (!coreExact) notes.push(inA.core.replace(/-/g, " ") === tA.core.replace(/-/g, " ") ? "achte auf den Bindestrich" : lang === "fr" ? "achte auf die Akzente" : "achte auf die Schreibweise");
      if (artMissing && lang === "fr") notes.push("lern den Artikel mit");
      if (artWrong && lang === "de") notes.push("im Deutschen heißt es " + tA.art);
      const hint = notes.length ? notes[0][0].toUpperCase() + notes.join(", ").slice(1) + `: ${shown}` : "";
      return { ok: true, hint };
    }
  }
  return best || { ok: false, hint: "" };
}

let frVoice = null;
function pickVoice() {

  } catch (e) {}
}
if (canSpeak) { pickVoice(); try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch (e) {} }

    if (btn) { btn.classList.add("playing"); u.onend = u.onerror = () => btn.classList.remove("playing"); }

}

                 : `<span><b>10</b> Fragen</span><span>bis zu ${COIN_SVG}<b>${fmtCoin(maxCoins)}</b></span>${sToday > 1 ? `<span>Bonus <b>${fmtMult(mult)}</b></span>` : ""}`}
      </div>
      <button class="btn" data-act="${resume ? "resume" : "start-daily"}">${resume ? "Fortsetzen" : "Runde starten"}</button>
    </div>`;
  }
  const pDone = practiceDone(), pResume = r && r.kind === "practice";
  const pAvail = pResume || DEV || (dailyDone() && !pDone);
  const practice = `<div class="list"><div class="list-row">
    <div class="grow"><h3>Übungsrunde</h3><p>${pResume ? `Frage ${r.i + 1} von 10` : dailyDone() ? (pDone ? "Für heute geübt." : "10 Fragen ohne Münzen. Deine Fehler von heute zuerst.") : "Nach der Tagesrunde verfügbar."}</p></div>
    <button class="btn sm${pAvail ? "" : " quiet"}" data-act="${pResume ? "resume" : "start-practice"}" ${pAvail ? "" : "disabled"}>${pResume ? "Weiter" : "Üben"}</button>
  </div></div>`;

  const played = save.streak.last === t;
  const wk = cur > 0 && cur % 7 === 0 && played ? 7 : cur % 7;
  const mo = cur > 0 && cur % 30 === 0 && played ? 30 : cur % 30;
  const streak = `<div class="section-title"><h2>Serie</h2><span>${played ? `morgen ${fmtMult(multFor(cur + 1))}` : cur ? "heute noch offen" : ""}</span></div>
  <div class="panel streak">
    <div class="streak-n"><b>${cur}</b><span>${cur === 1 ? "Tag" : "Tage"} in Folge</span></div>
    <div class="mult"><b>${fmtMult(played ? multFor(cur) : mult)}</b><span>Münzen je Antwort</span></div>
    <div class="goals">
      <div class="goal"><div class="goal-head"><span>Woche <b>+10</b></span><span class="mono">${wk}/7</span></div><div class="ticks">${Array.from({ length: 7 }, (_, i) => `<i class="${i < wk ? "on" : ""}"></i>`).join("")}</div></div>
      <div class="goal"><div class="goal-head"><span>Monat <b>+50</b></span><span class="mono">${mo}/30</span></div><div class="bar flame"><i style="width:${mo / 30 * 100}%"></i></div></div>
    </div>
  </div>`;

  const intro = introduced(), boxes = [0, 0, 0, 0, 0, 0];
  intro.forEach(w => boxes[W()[w.id].b]++);
  const dueN = intro.filter(w => W()[w.id].due <= t && W()[w.id].b >= 1).length;
  const nextNew = WORDS.find(w => !W()[w.id]);
  const total = WORDS.length;
  const C = ["", "var(--line-2)", "var(--brass)", "var(--brass)", "var(--ok)", "var(--ok)"];
  const seg = [1, 2, 3, 4, 5].filter(b => boxes[b]).map(b => `<i style="width:${boxes[b] / total * 100}%;background:${C[b]};opacity:${[0, 1, .55, 1, .55, 1][b]}"></i>`).join("");
  const vocab = `<div class="section-title"><h2>Wortschatz</h2><span>${intro.length}/${total}</span></div>
  <div class="panel">
    <div class="vstats flat">
      <div class="vstat"><b>${intro.length}</b><span>gelernt</span></div>
      <div class="vstat"><b>${boxes[5]}</b><span>beherrscht</span></div>
      <div class="vstat"><b>${dueN}</b><span>heute fällig</span></div>
    </div>
    <div class="boxbar">${seg}</div>
    <p style="font-size:.86rem">${nextNew ? `Aktuelles Thema: <b style="color:var(--ink);font-weight:600">${esc(nextNew.theme)}</b>` : "Alle Wörter eingeführt. Jetzt wird wiederholt."}</p>
    <div class="row"><button class="btn quiet sm" style="flex:1" data-act="wordlist">Wortliste</button><button class="btn quiet sm" style="flex:1" data-act="custom">Meine Wörter</button></div>
  </div>`;
  LB.innerHTML = hero + practice + `<div style="display:flex;flex-direction:column;gap:10px">${streak}</div><div style="display:flex;flex-direction:column;gap:10px">${vocab}</div>`;
  if (dailyDone()) cdTimer = setInterval(() => { const el = $("cd"); if (el) el.textContent = untilMidnight(); if (today() !== renderedDay) renderLearn(); }, 20000);
}

function learnAction(act, el) {
  if (act === "start-daily") { if (dailyDone()) return renderLearn(); save.round = buildDaily(); persist(); renderLearn(); }
  else if (act === "start-practice") { if (!DEV && (!dailyDone() || practiceDone())) return; save.round = buildPractice(); persist(); renderLearn(); }
  else if (act === "resume") renderLearn();
  else if (act === "pause") { lastSummary = null; renderHome(); $("view-learn").scrollTop = 0; }
  else if (act === "next") nextQuestion();
  else if (act === "check") submitWrite();
  else if (act === "opt") answerMc(el.dataset.id, el);
  else if (act === "acc") { const inp = $("q-input"); if (!inp || inp.readOnly) return; const s0 = inp.selectionStart ?? inp.value.length, s1 = inp.selectionEnd ?? s0; inp.value = inp.value.slice(0, s0) + el.textContent + inp.value.slice(s1); inp.focus(); inp.setSelectionRange(s0 + 1, s0 + 1); $("q-check").disabled = !inp.value.trim(); }
  else if (act === "home") { lastSummary = null; renderLearn(); $("view-learn").scrollTop = 0; }
  else if (act === "go-play") { lastSummary = null; renderHome(); showView("play"); }
  else if (act === "wordlist") openWordlist();
  else if (act === "custom") openCustom();
}

/* ---------------- Quiz ---------------- */
function renderQuiz() {
  const r = save.round, q = r.qs[r.i], w = WORD[q.w];
  if (!w) { r.ans[r.i] = { skip: true, ok: false, coins: 0 }; persist(); return nextQuestion(); }
  const a = r.ans[r.i];
  const daily = r.kind === "daily";
  const prog = r.qs.map((_, k) => { const x = r.ans[k]; return `<i class="${x ? (x.skip ? "" : x.ok ? "ok" : "bad") : k === r.i ? "cur" : ""}"></i>`; }).join("");
  const base = q.t === "mc" ? 1 : 3;
  const promptText = q.d === "fr2de" ? w.fr : display(w.de);
  const kind = q.t === "mc" ? (q.d === "fr2de" ? "Was heißt das?" : "Wie heißt das auf Französisch?") : (q.d === "fr2de" ? "Schreib es auf Deutsch" : "Schreib es auf Französisch");
  const isNew = a ? !!a.wasNew : !W()[q.w];
  const flag = q.d === "fr2de" ? "FR" : "DE";
  let body;
  if (q.t === "mc") {
    const side = q.d === "fr2de" ? "de" : "fr";
    body = `<div class="opts">${q.opts.map((id, k) => { const o = WORD[id]; if (!o) return ""; let cls = ""; if (a) { if (id === q.w) cls = "right"; else if (id === a.pick) cls = "wrong"; } return `<button class="opt ${cls}" data-act="opt" data-id="${esc(id)}" ${a ? "disabled" : ""}><kbd>${k + 1}</kbd><span>${esc(display(o[side]))}</span></button>`; }).join("")}</div>`;
  } else {
    const acc = q.d === "de2fr" ? ["é", "è", "ê", "à", "â", "ç", "ù", "û", "î", "ô", "ë", "ï", "œ", "’"] : ["ä", "ö", "ü", "ß"];
    body = `<div class="write">
      <input id="q-input" type="text" lang="${q.d === "de2fr" ? "fr" : "de"}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" placeholder="${q.d === "de2fr" ? "auf Französisch …" : "auf Deutsch …"}" ${a ? `readonly class="${a.ok ? "right" : "wrong"}" value="${esc(a.given || "")}"` : ""}>
      ${a ? "" : `<div class="accents">${acc.map(c => `<button data-act="acc" tabindex="-1">${c}</button>`).join("")}</div>
      <button class="btn" id="q-check" data-act="check" disabled>Prüfen</button>`}
    </div>`;
  }
  let fb = "";
  if (a) {
    const ansSide = q.d === "fr2de" ? "de" : "fr";
    const title = a.ok ? ["Richtig", "Genau", "Très bien", "Richtig", "Parfait"][(r.i * 7 + q.w.length) % 5] : "Nicht ganz";
    let picked = "";
    if (!a.ok && q.t === "mc" && a.pick && WORD[a.pick]) { const p = WORD[a.pick]; picked = `<div class="fb-hint">„${esc(display(p[ansSide]))}“ heißt ${q.d === "fr2de" ? "auf Französisch" : "auf Deutsch"}: ${esc(display(q.d === "fr2de" ? p.fr : p.de))}</div>`; }
    fb = `<div class="fb ${a.ok ? "ok" : "bad"}">
      <div class="fb-title"><span>${title}</span>${a.ok && daily ? `<span class="fb-coins">+${fmtCoin(a.coins)} ${COIN_SVG}</span>` : ""}</div>
      <div class="fb-ans">${speakBtn(w.fr, true)}<div><b>${esc(w.fr)}</b> = ${esc(display(w.de))}</div></div>
      ${a.hint ? `<div class="fb-hint">${esc(a.hint)}</div>` : ""}${picked}
      <button class="btn" id="q-next" data-act="next">${r.i >= r.qs.length - 1 ? "Ergebnis ansehen" : "Weiter"}</button>
    </div>`;
  }
  LB.innerHTML = `<div class="quiz">
    <div class="q-top"><button class="q-close" data-act="pause" aria-label="Pause">${closeIcon}</button><div class="q-prog">${prog}</div>
      ${daily ? `<span class="q-earn">${COIN_SVG}+${fmtCoin(r.earned)}</span>` : `<span class="q-earn practice">Übung</span>`}</div>
    <div class="q-card">
      <div class="q-meta"><span class="q-kind">${kind}</span>${isNew ? `<span class="q-badge new">Neues Wort</span>` : ""}${daily ? `<span class="q-badge rew">+${fmtCoin(round2(base * r.mult))}</span>` : ""}</div>
      <div class="q-word"><span>${esc(promptText)}</span>${q.d === "fr2de" ? speakBtn(w.fr) : ""}</div>
      <span class="q-theme">${flag === "FR" ? "Französisch" : "Deutsch"} · ${esc(w.theme)}</span>
    </div>
    ${body}${fb}
  </div>`;
  const inp = $("q-input");
  if (inp && !a) {
    inp.addEventListener("input", () => { $("q-check").disabled = !inp.value.trim(); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); submitWrite(); } });
    setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 60);
  }
  if (a) {
    const nb = $("q-next");
    setTimeout(() => { try { nb.focus({ preventScroll: true }); nb.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); } catch (e) {} }, 60);
  }
}

function recordAnswer(ok, extra) {
  const r = save.round, q = r.qs[r.i];
  let coins = 0;
  if (ok && r.kind === "daily") { coins = round2((q.t === "mc" ? 1 : 3) * r.mult); r.earned = round2(r.earned + coins); }
  r.ans[r.i] = Object.assign({ ok, coins, wasNew: !W()[q.w] }, extra);
  applyResult(q.w, ok);
  if (coins) addCoins(coins); else persist();
  renderQuiz();
  if (q.d === "de2fr" && canSpeak && ok) speak(WORD[q.w].fr);
}
function answerMc(id) {
  const r = save.round; if (!r || r.ans[r.i]) return;
  const q = r.qs[r.i];
  const side = q.d === "fr2de" ? "de" : "fr";
  const ok = id === q.w || (WORD[id] && looseKey(WORD[id][side]) === looseKey(WORD[q.w][side]));
  recordAnswer(ok, { pick: id });
}
function submitWrite() {
  const r = save.round; if (!r || r.ans[r.i]) return;
  const inp = $("q-input"); if (!inp || !inp.value.trim()) return;
  const q = r.qs[r.i];
  const res = checkWrite(WORD[q.w], q.d, inp.value);
  recordAnswer(res.ok, { given: inp.value.trim(), hint: res.hint });
}
document.addEventListener("keydown", e => {
  if (currentView !== "learn" || $("sheet-root").firstChild) return;
  if (/^[1-4]$/.test(e.key) && document.activeElement?.tagName !== "INPUT") {
    const r = save.round; const q = r && r.qs[r.i];
    if (q && q.t === "mc" && !r.ans[r.i] && q.opts[+e.key - 1]) { e.preventDefault(); answerMc(q.opts[+e.key - 1]); }
    return;
  }
  if (e.key !== "Enter") return;
  const nb = $("q-next");
  if (nb && document.activeElement !== nb) { e.preventDefault(); nb.click(); }
});
function nextQuestion() {
  const r = save.round; if (!r) return renderLearn();
  if (r.i < r.qs.length - 1) { r.i++; persist(); renderQuiz(); $("view-learn").scrollTop = 0; return; }
  finishRound();
}
function finishRound() {
  const r = save.round, t = today();
  const ok = r.ans.filter(x => x && x.ok).length;
  const missed = [...new Set(r.qs.filter((q, k) => r.ans[k] && !r.ans[k].ok && !r.ans[k].skip).map(q => q.w))];
  const sum = { kind: r.kind, ok, n: r.qs.length, earned: r.earned, missed, bonus: [] };
  if (r.kind === "daily") {
    const s = save.streak;
    if (s.last !== t) { s.count = s.last === t - 1 ? s.count + 1 : 1; s.last = t; }
    let bonus = 0;
    if (s.count % 7 === 0) { bonus += 10; sum.bonus.push(["Wochenbonus", 10, `${s.count} Tage in Folge`]); }
    if (s.count % 30 === 0) { bonus += 50; sum.bonus.push(["Monatsbonus", 50, `${s.count} Tage in Folge`]); }
    save.daily = { day: t, done: true, practice: false, ok, earned: round2(r.earned + bonus) };
    sum.streak = s.count; sum.mult = r.mult; sum.next = multFor(s.count + 1);
    save.round = null;
    if (bonus) addCoins(bonus); else persist();
    if (save.coins >= COST.normal) $("play-dot").hidden = false;
  } else {
    if (save.daily.day === t) save.daily.practice = true;
    save.round = null; persist();
  }
  lastSummary = sum;
  updateCoinUI();
  renderSummary();
  $("view-learn").scrollTop = 0;
}
function renderSummary() {
  const s = lastSummary, daily = s.kind === "daily";
  const msg = s.ok === s.n ? "Fehlerfrei." : s.ok >= 8 ? "Starke Runde." : s.ok >= 5 ? "Gut gemacht." : "Morgen sitzt es besser.";
  LB.innerHTML = `<div class="result">
      <span class="eyebrow">${daily ? "Tagesrunde abgeschlossen" : "Übungsrunde abgeschlossen"}</span>
      <h2>${msg}</h2>
      <div class="result-nums">
        <div><b>${s.ok}<small>/${s.n}</small></b><span>richtig</span></div>
        ${daily ? `<div><b>${COIN_SVG}${fmtCoin(s.earned)}</b><span>Münzen verdient</span></div>` : `<div><b>–</b><span>Übung ohne Münzen</span></div>`}
      </div>
      ${daily ? `<p>${s.streak} ${s.streak === 1 ? "Tag" : "Tage"} in Folge. Morgen gibt es ${fmtMult(s.next)} pro richtiger Antwort.</p>` : ""}
      ${s.bonus.map(([n, v, d]) => `<div class="bonus">${COIN_SVG}<span><b>${n}: +${v} Münzen</b><br>${d}</span></div>`).join("")}
      ${s.missed.length ? `<div><span class="eyebrow">Zum Wiederholen</span><div class="miss" style="margin-top:8px">${s.missed.map(id => WORD[id]).filter(Boolean).map(w => `<div class="miss-row">${speakBtn(w.fr, true)}<div class="grow"><b>${esc(w.fr)}</b><span>${esc(display(w.de))}</span></div></div>`).join("")}</div></div>` : ""}
      <div class="btn-col">
        ${daily ? `<button class="btn" data-act="go-play">Lose kaufen</button>` : ""}
        ${daily && !practiceDone() ? `<button class="btn secondary" data-act="start-practice">Übungsrunde</button>` : ""}
        <button class="btn ${daily ? "quiet" : ""}" data-act="home">Zur Übersicht</button>
      </div>
    </div>`;
  if (daily && s.bonus.length && !reduceMotion) toast(s.bonus.map(b => `${b[0]} +${b[1]}`).join(" · "));
}

/* ---------------- Wortliste & eigene Wörter ---------------- */
function boxDots(id) {
  const st = W()[id];
  if (!st) return `<span class="boxdots"><i></i><i></i><i></i><i></i><i></i></span>`;
  return `<span class="boxdots${st.b === 5 ? " master" : ""}">${[1, 2, 3, 4, 5].map(b => `<i class="${st.b >= b ? "on" : ""}"></i>`).join("")}</span>`;
}
function openWordlist() {
  rebuildWords();
  const themes = [];
  for (const w of WORDS) { let t = themes.find(x => x.name === w.theme); if (!t) themes.push(t = { name: w.theme, list: [] }); t.list.push(w); }
  const sheet = openSheet(`<h2>Wortliste</h2>
    <p style="margin-top:6px">Die Punkte zeigen das Fach: 5 grüne Punkte heißt beherrscht. Grau sind Wörter, die noch kommen.${canSpeak ? " Tippe auf ein Wort zum Anhören." : ""}</p>
    ${themes.map(t => { const n = t.list.filter(w => W()[w.id]).length; return `<div class="wl-theme"><h3>${esc(t.name)} <small>${n}/${t.list.length}</small></h3><div class="wl">${t.list.map(w => `<button class="wl-row${W()[w.id] ? "" : " locked"}" data-speak="${esc(w.fr)}">${boxDots(w.id)}<span class="fr">${esc(w.fr)}</span><span class="de">${esc(display(w.de))}</span></button>`).join("")}</div></div>`; }).join("")}`, "Wortliste");
  sheet.addEventListener("click", e => { const b = e.target.closest("[data-speak]"); if (b) speak(b.dataset.speak); });
}
function openCustom() {
  const delIcon = closeIcon;
  const render = () => {
    const list = save.learn.custom;
    sheet.querySelector("#cw-list").innerHTML = list.length ? `<div class="wl">${list.map(c => `<div class="wl-row">${boxDots(c.id)}<span class="fr">${esc(c.fr)}</span><span class="de">${esc(c.de)}</span><button class="del" data-del="${esc(c.id)}" aria-label="Löschen">${delIcon}</button></div>`).join("")}</div>` : `<p class="hint">Noch keine eigenen Wörter.</p>`;
  };
  const sheet = openSheet(`<h2>Meine Wörter</h2>
    <p style="margin-top:6px">Eigene Vokabeln, z. B. aus Kurs oder Schule. Sie kommen vor den eingebauten Wörtern dran, 2–3 neue pro Tag.</p>
    <div class="section">
      <h3>Wörter hinzufügen</h3>
      <p>Eine Vokabel pro Zeile: <b>Französisch = Deutsch</b>. Mehrere deutsche Bedeutungen mit „/“ trennen.</p>
      <textarea id="cw-in" placeholder="la maison = das Haus&#10;le chien = der Hund&#10;aimer = lieben / mögen" lang="fr" spellcheck="false"></textarea>
      <div class="row"><button class="btn" id="cw-add">Hinzufügen</button></div>
      <div id="cw-msg"></div>
    </div>
    <div class="section"><h3>Deine Liste</h3><div id="cw-list"></div></div>`, "Meine Wörter");
  render();
  sheet.querySelector("#cw-add").addEventListener("click", () => {
    const lines = sheet.querySelector("#cw-in").value.split(/\n/).map(l => l.trim()).filter(Boolean);
    let added = 0, bad = 0, dup = 0;
    const have = new Set([...save.learn.custom.map(c => looseKey(c.fr)), ...BUILTIN.map(b => looseKey(b.fr))]);
    for (const l of lines) {
      const m = l.split(/\s*(?:=|;|\t|\s-\s|\s–\s)\s*/);
      if (m.length < 2 || !m[0] || !m[1]) { bad++; continue; }
      const fr = m[0].trim(), de = m.slice(1).join(" / ").replace(/\s*,\s*/g, " / ").trim();
      if (have.has(looseKey(fr))) { dup++; continue; }
      have.add(looseKey(fr));
      save.learn.custom.push({ id: "c:" + Date.now().toString(36) + Math.floor(rand() * 1e6).toString(36), fr: fr.slice(0, 80), de: de.slice(0, 120) });
      added++;
    }
    persist(); rebuildWords(); render();
    if (added) sheet.querySelector("#cw-in").value = "";
    sheet.querySelector("#cw-msg").innerHTML = lines.length ? `<p class="hint">${added} hinzugefügt${dup ? ` · ${dup} schon vorhanden` : ""}${bad ? ` · ${bad} Zeile${bad > 1 ? "n" : ""} ohne „=“ übersprungen` : ""}</p>` : "";
    if (currentView === "learn" && !save.round && !lastSummary) renderHome();
  });
  sheet.querySelector("#cw-list").addEventListener("click", e => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    const id = b.dataset.del;
    save.learn.custom = save.learn.custom.filter(c => c.id !== id);
    delete save.learn.w[id];
    persist(); rebuildWords(); render();
    if (currentView === "learn" && !save.round && !lastSummary) renderHome();
  });
}

function markCatalogReady() {

  catalogReady = true;
  restoreRound();

let lastCatalogFetch = 0;
async function loadKatalog() {
  lastCatalogFetch = Date.now();
  try {
    const res = await fetch("katalog.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    setCatalog(Array.isArray(data) ? data : data.items);
    // Neue Fundstücke seit dem letzten Besuch melden
    const ids = CATALOG.map(it => it.id);
    if (Array.isArray(prefs.seenItems)) {
      const fresh = ids.filter(id => !prefs.seenItems.includes(id));
      if (fresh.length) { $("museum-dot").hidden = false; toast(fresh.length === 1 ? "Neu im Museum: 1 Fundstück wartet auf dich" : `Neu im Museum: ${fresh.length} Fundstücke warten auf dich`); }
    }
    prefs.seenItems = ids; savePrefs();
  } catch (e) {
    if (!CATALOG.length) toast("Die Sammlung konnte nicht geladen werden. Prüf die Internetverbindung.");
  }
  museumDirty = true;
  updateProgressChip();
  if (currentView === "museum") renderMuseum();
  if (catalogReady) updateActions(); else markCatalogReady();
}

document.querySelectorAll(".brand").forEach(b => b.addEventListener("click", () => {

document.querySelectorAll("[data-dev-open]").forEach(b => { b.hidden = !DEV; b.addEventListener("click", openDevPanel); });
function openDevPin() {
  const sheet = openSheet(`<h2>Entwicklermodus</h2>
    <p style="margin-top:6px">Zum Testen mit eigenem Spielstand, 1000 Münzen und unbegrenzten Runden. Dein normaler Spielstand bleibt unverändert.</p>
    <div class="section">
      <label class="field"><span>PIN</span><input type="password" id="dev-pin" inputmode="numeric" autocomplete="off" maxlength="12"></label>
      <div id="dev-msg"></div>
      <div class="row"><button class="btn" id="dev-go">Freischalten</button></div>
    </div>`, "Entwicklermodus");
  const inp = sheet.querySelector("#dev-pin");
  const go = () => {
    if (inp.value.trim() !== DEV_PIN) { sheet.querySelector("#dev-msg").innerHTML = `<div class="confirm">Die PIN stimmt nicht.</div>`; inp.select(); return; }
    persistLocal();
    try { localStorage.setItem(DEV_KEY, "1"); } catch (e) {}
    location.reload();
  };
  sheet.querySelector("#dev-go").addEventListener("click", go);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  setTimeout(() => inp.focus(), 50);
}
function openDevPanel() {
  const o = computeOdds();
  const P = v => v ? (v * 100 >= 10 ? (v * 100).toFixed(1) : (v * 100).toFixed(2)).replace(".", ",") + " %" : "–";
  const WL = { 0.5: "seltener", 0.25: "deutlich seltener", 0.1: "sehr selten" };
  const rows = RARITIES.map(r => {
    const items = CATALOG.filter(it => it.rarity === r.id).sort((a, b) => (o.item.normal[b.id] || o.item.gold[b.id] || 0) - (o.item.normal[a.id] || o.item.gold[a.id] || 0));
    return `<tr class="tier"><td><span class="pill" data-rarity="${r.id}" style="font-size:.88rem">${r.name}</span> <span class="weight">${items.length}</span></td><td></td><td>${P(o.tier.normal[r.id])}</td><td>${P(o.tier.gold[r.id])}</td></tr>` +
      items.map(it => `<tr class="sub"><td title="${esc(it.name)}">${esc(it.name)}${it.weight < 1 ? `<span class="weight">${WL[it.weight] || "×" + it.weight}</span>` : ""}</td><td>${isPriceless(it) ? "∞" : fmtInt.format(it.value) + " €"}</td><td>${P(o.item.normal[it.id])}</td><td>${P(o.item.gold[it.id])}</td></tr>`).join("");
  }).join("");
  const sheet = openSheet(`<h2>Entwicklermodus</h2>
    <p style="margin-top:6px">Test-Spielstand${DEV_DAY ? ` · simulierter Tag +${DEV_DAY}` : ""}. Tages- und Übungsrunde sind unbegrenzt und bringen jedes Mal Münzen.</p>
    <div class="section">
      <div class="row"><button class="btn" id="dv-coins">+1000 Münzen</button><button class="btn quiet" id="dv-day">Nächster Tag</button></div>
      <p class="hint">„Nächster Tag“ springt einen Tag vor, z. B. um Serie, Wochen- und Monatsbonus zu testen.</p>
      <div class="row"><button class="btn secondary" id="dv-reset">Test-Spielstand zurücksetzen</button></div>
      <div id="dv-confirm"></div>
    </div>
    <div class="section">
      <h3>Chancen pro Los</h3>
      <p>So wahrscheinlich ist jede Seltenheit und jedes Fundstück im Moment. Stufen ohne Fundstück fallen weg, ihre Chance verteilt sich auf die anderen. Innerhalb einer Stufe sind alle Stücke gleich häufig, außer du hast bei einem die Häufigkeit heruntergesetzt. Der Wert spielt keine Rolle.</p>
      <div style="overflow-x:auto"><table class="odds dev-table"><thead><tr><th>Stück</th><th>Wert</th><th>Los</th><th>Goldlos</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="hint">Grundwerte: Gewöhnlich 50 · Ungewöhnlich 28 · Selten 15 · Episch 5 · Legendär 1,8 · Mythisch 0,2. Beim Goldlos fällt Gewöhnlich weg, und ab Selten zählt jede Stufe doppelt.</p>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn danger" id="dv-exit">Entwicklermodus verlassen</button></div>`, "Entwicklermodus");
  sheet.querySelector("#dv-coins").addEventListener("click", () => { addCoins(1000); toast("+1000 Münzen"); });
  sheet.querySelector("#dv-day").addEventListener("click", () => {
    persist();
    try { localStorage.setItem(DEV_DAY_KEY, String(DEV_DAY + 1)); } catch (e) {}
    location.reload();
  });
  sheet.querySelector("#dv-reset").addEventListener("click", () => {
    const box = sheet.querySelector("#dv-confirm");
    box.innerHTML = `<div class="confirm">Test-Spielstand löschen und mit 1000 Münzen neu starten?<div class="row"><button class="btn danger sm" id="dv-yes">Zurücksetzen</button><button class="btn quiet sm" id="dv-no">Abbrechen</button></div></div>`;
    box.querySelector("#dv-no").onclick = () => { box.innerHTML = ""; };
    box.querySelector("#dv-yes").onclick = () => {
      saveLocked = true;
      try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(DEV_DAY_KEY); } catch (e) {}
      location.reload();
    };
  });
  sheet.querySelector("#dv-exit").addEventListener("click", () => {
    persistLocal();
    try { localStorage.removeItem(DEV_KEY); } catch (e) {}
    location.reload();
  });
}

/* ---------------- Start ---------------- */
async function restoreRound() {
  const cur = save.current;
  const it = cur && BY_ID[cur.itemId];
  if (!it) {
    // Fundstück wurde gelöscht, bevor das Los gerubbelt war: Münzen zurück
    if (cur && !cur.saved) { save.current = null; addCoins(cur.gold ? COST.gold : COST.normal); toast("Ein Fundstück wurde entfernt. Deine Münzen sind zurück."); }
    return showIdleTicket();
  }
  state = "dealing";
  if (cur.saved) {
    await prepareTicket(it, cur.seq, true, cur.gold);
    showPlatePost(it, save.items[it.id], !!cur.isNew, false);
    state = "revealed"; setButton(true);
  } else {
    showPlatePre(cur.gold);
    await prepareTicket(it, cur.seq, false, cur.gold);
    state = "scratch"; setButton(false);
  }
}

buildSilver();
resetMask();
updateProgressChip();
updateCoinUI();
showIdleTicket();
showView("learn");
loadKatalog();
// Silberschicht nach dem Laden der Schrift einmal neu prägen (Inhalt der Maske bleibt erhalten)
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildSilver(); render(performance.now()); });
document.addEventListener("visibilitychange", () => { if (document.hidden) persistLocal(); });
window.addEventListener("pagehide", persistLocal);

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
window.__rm = { get state() { return state; }, get save() { return save; }, reveal, drawItem, addCoins, today, buildDaily, checkWrite, WORDS };
})();
