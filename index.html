<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#212226" media="(prefers-color-scheme: dark)">
<script>/* gewähltes Farbschema vor dem ersten Zeichnen setzen */ try { const t = localStorage.getItem("rubbelmuseum.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rubbelmuseum">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Französisch lernen, Münzen sammeln, Rubbellose freirubbeln und das eigene Museum füllen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Rubbelmuseum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: App mit drei Ansichten (Lernen · Los · Museum) über einer Tab-Leiste.
   Richtung: helle Galerie. Neutrale Wände, Tinte für Aktionen, Messing nur für Münzen. */
:root {
  --bg: #F8F5F6;
  --surface: #FFFFFF;
  --sunken: #F0EAED;
  --field: #F4EFF1;
  --ink: #1E1B1F;
  --ink-2: #625C63;
  --ink-3: #A49DA4;
  --line: #EDE5E9;
  --line-2: #DCD1D6;
  --on-ink: #FFFFFF;
  --accent: #DC4D86;
  --accent-soft: #FCE6EF;
  --accent-ink: #B02F64;
  --on-accent: #FFFFFF;
  --brass: #B08130;
  --coin-line: #F5DFAE;
  --brass-ink: #7A5715;
  --brass-soft: #F5EEDF;
  --flame: #D9662B;
  --ok: #2E7A4D;
  --ok-soft: #E6F1EA;
  --bad: #B5452F;
  --bad-soft: #F8E7E2;
  --wall: #FBFBFA;
  --shadow: 0 1px 2px rgba(21,22,25,.05), 0 10px 30px -18px rgba(21,22,25,.28);
  --r-gewoehnlich: #8C8F94;
  --r-ungewoehnlich: #3C8C5A;
  --r-selten: #2F6FB8;
  --r-episch: #8150C4;
  --r-legendaer: #C9861A;
  --r-mythisch: #1FA3A8;
  --f-ui: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  height: 100%;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #212226; --surface: #2B2D32; --sunken: #34363C; --field: #33353B; --ink: #F4F1F3; --ink-2: #B9B3B9; --ink-3: #7F7980;
    --line: #393B41; --line-2: #4B4D54; --on-ink: #212226; --accent: #F27BAA; --accent-soft: #4A2B3A; --accent-ink: #F8A6C6; --on-accent: #2A1120;
    --brass: #D3A452; --coin-line: #FFE7B3; --brass-ink: #E5BE72; --brass-soft: #3A3122;
    --flame: #F08A4B; --ok: #6CC391; --ok-soft: #233629; --bad: #EE8A74; --bad-soft: #3E2621; --wall: #26272B;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 30px -16px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #212226; --surface: #2B2D32; --sunken: #34363C; --field: #33353B; --ink: #F4F1F3; --ink-2: #B9B3B9; --ink-3: #7F7980;
  --line: #393B41; --line-2: #4B4D54; --on-ink: #212226; --accent: #F27BAA; --accent-soft: #4A2B3A; --accent-ink: #F8A6C6; --on-accent: #2A1120;
  --brass: #D3A452; --coin-line: #FFE7B3; --brass-ink: #E5BE72; --brass-soft: #3A3122;
  --flame: #F08A4B; --ok: #6CC391; --ok-soft: #233629; --bad: #EE8A74; --bad-soft: #3E2621; --wall: #26272B;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 30px -16px rgba(0,0,0,.55);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body, .scroll, .brand, button, a, input, label, textarea { touch-action: manipulation; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--f-ui);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.view { flex: 1; min-height: 0; position: relative; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.pane { padding: 4px 16px 32px; display: flex; flex-direction: column; gap: 20px; min-height: 100%; }

/* ---------- Kopfzeile ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; flex: none; }
.brand { display: flex; align-items: center; gap: 9px; font: 600 1.02rem/1 var(--f-ui); letter-spacing: -0.015em; }
.brand svg { width: 22px; height: 22px; flex: none; }
.chips { display: flex; gap: 14px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 .9rem/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.chip .muted { color: var(--ink-3); }
#chip-progress { gap: 0; }
.chip svg { width: 16px; height: 16px; flex: none; }
.chip-streak.off svg { opacity: .3; filter: grayscale(1); }
.chip-streak.off { color: var(--ink-3); }
.theme-btn { width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); display: grid; place-items: center; padding: 0; }
.theme-btn svg { width: 18px; height: 18px; }
.i-moon { display: block; } .i-sun { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .i-moon { display: none; } :root:not([data-theme="light"]) .i-sun { display: block; } }
:root[data-theme="dark"] .i-moon { display: none; } :root[data-theme="dark"] .i-sun { display: block; }
.menu { gap: 0; padding: 4px 16px; }
.switch-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; cursor: pointer; }
.switch-row + .switch-row { border-top: 1px solid var(--line); }
.switch-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.switch-row b { font-weight: 600; font-size: .98rem; }
.switch-row small { font-size: .82rem; color: var(--ink-2); }
.sw-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.sw-ico svg { width: 18px; height: 18px; }
.switch { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 28px; background: var(--line-2); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .2s ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s ease; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }
.switch:disabled { opacity: .4; cursor: default; }
.dev-chip { border: 0; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); font: 600 .72rem/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.brand { cursor: default; -webkit-user-select: none; user-select: none; min-width: 0; overflow: hidden; white-space: nowrap; }
.topbar .chips { flex: none; }
@media (max-width: 420px) { .chips { gap: 8px; } .theme-btn { width: 28px; } }
.dev-table { table-layout: fixed; }
.dev-table th, .dev-table td { white-space: nowrap; }
.dev-table th:nth-child(2), .dev-table td:nth-child(2) { width: 62px; }
.dev-table th:nth-child(3), .dev-table td:nth-child(3), .dev-table th:nth-child(4), .dev-table td:nth-child(4) { width: 64px; padding-left: 8px; }
.dev-table td:first-child { overflow: hidden; text-overflow: ellipsis; }
.dev-table .sub td { color: var(--ink-2); font-size: .82rem; }
.dev-table .sub td:first-child { padding-left: 14px; }
.dev-table .tier td { font-weight: 600; padding-top: 12px; }
.dev-table .weight { color: var(--ink-3); font-size: .74rem; margin-left: 4px; }
.chip.bump { animation: bump .5s cubic-bezier(.2,.9,.3,1.3); }
@keyframes bump { 40% { transform: scale(1.18); } }
.coin { width: 1em; height: 1em; vertical-align: -0.13em; flex: none; }

/* ---------- Allgemein ---------- */
.eyebrow { font: 500 .75rem/1.2 var(--f-ui); letter-spacing: .04em; color: var(--ink-3); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-title h2 { margin: 0; font: 600 1.05rem/1.2 var(--f-ui); letter-spacing: -0.01em; }
.section-title span { font: 500 .8rem/1 var(--f-mono); color: var(--ink-3); }
.panel { background: var(--surface); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.panel p, .sheet p { margin: 0; color: var(--ink-2); font-size: .93rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px;
  border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: 600 1rem/1 var(--f-ui); letter-spacing: -0.005em;
  transition: transform .12s ease, opacity .2s ease; flex: 1 1 auto;
}
.btn:active:not(:disabled) { transform: scale(.985); }
.btn.secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.quiet { background: var(--field); color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.sm { height: 38px; padding: 0 14px; font-size: .88rem; border-radius: 10px; flex: none; }
.btn:disabled { opacity: .35; cursor: default; }
.btn .coin { width: 1.05em; height: 1.05em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.hint { font-size: .82rem; color: var(--ink-3); }

/* Felder */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font: 500 .8rem/1.2 var(--f-ui); color: var(--ink-2); }
input[type=text], input[type=number], textarea {
  width: 100%; border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  padding: 13px 14px; font: 400 1rem/1.3 var(--f-ui); outline: none;
  box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s ease, background .15s ease;
}
input[type=text]:focus, input[type=number]:focus, textarea:focus { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
textarea { resize: vertical; min-height: 96px; }
textarea.code { font: 400 .74rem/1.4 var(--f-mono); word-break: break-all; min-height: 72px; }
input[type=file] { display: none; }

/* ---------- Lernen: Übersicht ---------- */
.hero { background: var(--surface); border-radius: 20px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.hero h2 { margin: 0; font: 600 1.75rem/1.1 var(--f-ui); letter-spacing: -0.03em; }
.hero p { margin: 0; color: var(--ink-2); }
.hero .facts-line { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .88rem; color: var(--ink-2); }
.hero .facts-line b { color: var(--ink); font: 500 .9rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.hero .facts-line span { display: inline-flex; align-items: center; gap: 6px; }
.done-row { display: flex; align-items: center; gap: 14px; }
.done-check { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.done-check svg { width: 20px; height: 20px; }
.countdown { font: 500 .92rem/1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }

.list { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.list-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.list-row + .list-row { border-top: 1px solid var(--line); }
.list-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.list-row h3 { margin: 0; font: 600 1rem/1.25 var(--f-ui); letter-spacing: -0.01em; }
.list-row p { margin: 0; font-size: .86rem; color: var(--ink-2); }

.streak { display: grid; grid-template-columns: 1fr auto; gap: 16px 12px; align-items: end; }
.streak-n { display: flex; align-items: baseline; gap: 8px; }
.streak-n b { font: 600 2.6rem/.9 var(--f-ui); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.streak-n span { color: var(--ink-2); font-size: .9rem; }
.mult { text-align: right; }
.mult b { display: block; font: 500 1.3rem/1 var(--f-mono); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.mult span { font-size: .75rem; color: var(--ink-3); }
.goals { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.goal { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.goal-head { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--ink-2); }
.goal-head b { color: var(--ink); font-weight: 600; }
.goal-head .mono { color: var(--ink-3); }
.ticks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.ticks i { height: 4px; border-radius: 4px; background: var(--sunken); }
.ticks i.on { background: var(--accent); }
.bar { height: 4px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.flame i { background: var(--accent); }

.vstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.vstat { background: var(--surface); padding: 12px 4px 2px 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vstat b { font: 600 1.5rem/1 var(--f-ui); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.vstat span { font-size: .76rem; color: var(--ink-3); }
.vstats.flat { background: none; gap: 12px; }
.boxbar { display: flex; height: 6px; border-radius: 6px; overflow: hidden; background: var(--sunken); gap: 2px; }
.boxbar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .76rem; color: var(--ink-3); }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* ---------- Quiz ---------- */
.quiz { display: flex; flex-direction: column; gap: 18px; flex: 1; }
.q-top { display: flex; align-items: center; gap: 12px; }
.q-close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; flex: none; color: var(--ink-2); margin-left: -8px; }
.q-close svg { width: 16px; height: 16px; }
.q-prog { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.q-prog i { height: 4px; border-radius: 4px; background: var(--sunken); }
.q-prog i.ok { background: var(--ok); }
.q-prog i.bad { background: var(--bad); }
.q-prog i.cur { background: var(--accent); }
.q-earn { display: inline-flex; align-items: center; gap: 5px; font: 500 .9rem/1 var(--f-mono); font-variant-numeric: tabular-nums; flex: none; }
.q-earn.practice { font: 500 .78rem/1 var(--f-ui); color: var(--ink-3); }

.q-card { padding: 28px 4px 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.q-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); }
.q-badge { font: 500 .75rem/1 var(--f-ui); padding: 4px 8px; border-radius: 6px; }
.q-badge.new { background: var(--ok-soft); color: var(--ok); }
.q-badge.rew { background: var(--accent-soft); color: var(--accent-ink); display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); }
.q-word { font: 600 clamp(2rem, 9vw, 2.6rem)/1.08 var(--f-ui); letter-spacing: -0.035em; overflow-wrap: anywhere; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.q-flag { font: 500 .7rem/1 var(--f-mono); color: var(--ink-3); letter-spacing: .06em; border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 4px; align-self: center; }
.q-theme { font-size: .8rem; color: var(--ink-3); }
.speak { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--field); display: inline-grid; place-items: center; flex: none; color: var(--ink); }
.speak svg { width: 18px; height: 18px; }
.speak.sm { width: 32px; height: 32px; }
.speak.sm svg { width: 15px; height: 15px; }
.speak.playing { background: var(--accent-soft); color: var(--accent-ink); }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 14px; min-height: 56px; width: 100%; text-align: left;
  border: 0; border-radius: 12px; background: var(--surface); padding: 12px 16px; font: 500 1.02rem/1.25 var(--f-ui);
  box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .15s ease, background .15s ease, transform .1s ease;
}
.opt kbd { font: 500 .72rem/1 var(--f-mono); color: var(--ink-3); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--field); flex: none; }
.opt span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
@media (hover: hover) { .opt:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--accent); } }
.opt:active:not(:disabled) { transform: scale(.99); }
.opt:disabled { cursor: default; color: var(--ink-3); }
.opt.right { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); }
.opt.wrong { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.opt.right kbd, .opt.wrong kbd { background: transparent; color: inherit; }

.write { display: flex; flex-direction: column; gap: 12px; }
.write input[type=text] { font-size: 1.25rem; padding: 16px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.write input[type=text]:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
.write input.right { background: var(--ok-soft) !important; color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok) !important; }
.write input.wrong { background: var(--bad-soft) !important; color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad) !important; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; }
.accents button { min-width: 38px; height: 38px; border-radius: 8px; border: 0; background: var(--field); font: 500 1rem/1 var(--f-ui); padding: 0 8px; }
.accents button:active { background: var(--sunken); }

.q-sentence { font-size: clamp(1.45rem, 6.4vw, 1.8rem); line-height: 1.2; letter-spacing: -0.02em; }
.q-instr { font-size: 1.15rem; font-weight: 500; letter-spacing: -0.01em; color: var(--ink-2); }
.blank { display: inline-block; min-width: 2.2em; padding: 0 .15em; border-bottom: 2.5px solid var(--accent); color: var(--accent-ink); text-align: center; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pair { min-height: 52px; border: 0; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 10px; font: 500 .95rem/1.2 var(--f-ui); overflow-wrap: anywhere; transition: background .15s ease, box-shadow .15s ease, opacity .2s ease; }
.pair.sel { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.pair.matched { background: var(--ok-soft); color: var(--ok); box-shadow: none; opacity: .75; cursor: default; }
.pair.wrong { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.order-line { min-height: 64px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 500 1.05rem/1.3 var(--f-ui); }
.order-line.right { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); padding: 14px; }
.order-line.wrong { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); padding: 14px; }
.order-ph { color: var(--ink-3); font-size: .9rem; padding: 0 4px; }
.word-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.word { height: 42px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 0 var(--line); font: 500 1rem/1 var(--f-ui); }
.word.on { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.word:disabled { opacity: .2; box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.fb { border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; animation: rise .28s cubic-bezier(.2,.8,.2,1) both; background: var(--surface); box-shadow: var(--shadow); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.fb-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 1.05rem/1.2 var(--f-ui); }
.fb.ok .fb-title { color: var(--ok); }
.fb.bad .fb-title { color: var(--bad); }
.fb-coins { display: inline-flex; align-items: center; gap: 5px; font: 500 .95rem/1 var(--f-mono); color: var(--brass-ink); }
.fb-ans { display: flex; align-items: center; gap: 12px; font-size: .95rem; color: var(--ink-2); }
.fb-ans b { font: 600 1.1rem/1.2 var(--f-ui); color: var(--ink); }
.fb-hint { font-size: .86rem; color: var(--ink-2); }

/* ---------- Ergebnis ---------- */
.result { background: var(--surface); border-radius: 20px; padding: 26px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.result h2 { margin: 0; font: 600 1.6rem/1.1 var(--f-ui); letter-spacing: -0.03em; }
.result-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.result-nums div { display: flex; flex-direction: column; gap: 4px; }
.result-nums b { font: 600 2.2rem/1 var(--f-ui); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
.result-nums b small { font-size: 1rem; color: var(--ink-3); letter-spacing: 0; font-weight: 500; }
.result-nums span { font-size: .8rem; color: var(--ink-3); }
.result-nums .coin { width: .8em; height: .8em; }
.bonus { display: flex; align-items: center; gap: 12px; background: var(--brass-soft); color: var(--brass-ink); border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
.bonus .coin { width: 22px; height: 22px; }
.miss { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.miss-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.miss-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.miss-row b { font: 600 1rem/1.2 var(--f-ui); }
.miss-row span { font-size: .86rem; color: var(--ink-2); }
.btn-col { display: flex; flex-direction: column; gap: 8px; }

/* ---------- Los ---------- */
.play { display: flex; flex-direction: column; padding: 0 16px 12px; gap: 12px; }
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.ticket {
  --tw: min(100cqw, 100cqh * 0.68, 400px);
  --r: var(--r-gewoehnlich);
  width: var(--tw); font-size: calc(var(--tw) * 0.042);
  position: relative; background: var(--surface); border-radius: 1.1em; padding: 1em 1em .4em;
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.t-head { display: flex; justify-content: space-between; align-items: center; height: 1.2em; margin-bottom: .9em; color: var(--ink); }
.t-brand { font: 600 .82em/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; }
.t-no { font: 400 .78em/1 var(--f-mono); color: var(--ink-3); }
.t-no b { font-weight: 500; color: var(--ink-2); }
.t-window { position: relative; aspect-ratio: 1; width: 100%; border-radius: .7em; overflow: hidden; isolation: isolate; }
.prize { position: absolute; inset: 0; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 46%, #FFFFFF 0%, color-mix(in srgb, var(--r) 7%, #FAFAF8) 45%, color-mix(in srgb, var(--r) 20%, #F1F1EE) 100%); }
.prize .rays { position: absolute; inset: -30%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--r) 12%, transparent) 0deg 6deg, transparent 6deg 18deg); opacity: .5; }
.ticket[data-rarity="mythisch"] .prize { background: radial-gradient(circle at 50% 45%, #42388C 0%, #201A4E 50%, #0F0C28 100%); }
.sticker { position: absolute; inset: 0; margin: auto; display: block; width: 74%; height: 74%; object-fit: contain;
  filter: drop-shadow(0 .25em .35em rgba(20,20,25,.18)) drop-shadow(0 .8em 1em rgba(20,20,25,.12)); -webkit-user-drag: none; pointer-events: none; }
.foil { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; touch-action: none; cursor: grab;
  transition: opacity .55s ease, transform .6s cubic-bezier(.2,.8,.2,1), filter .55s ease; }
.foil:active { cursor: grabbing; }
.foil.gone { opacity: 0; transform: scale(1.06); filter: blur(3px) brightness(1.3); pointer-events: none; }
.foil.instant { transition: none; }
.fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.flash { position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.9) 50%, transparent 65%); }
.t-perf { position: relative; height: 1.2em; margin: 0 -1em; }
.t-perf::before { content: ""; position: absolute; left: 1.2em; right: 1.2em; top: 50%; border-top: 1px dashed var(--line-2); }
.t-perf::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 0 50%, var(--bg) .5em, transparent .54em), radial-gradient(circle at 100% 50%, var(--bg) .5em, transparent .54em); }
.t-plate { height: 6.1em; display: flex; flex-direction: column; justify-content: center; gap: .3em; padding: 0 .1em; overflow: hidden; }
.plate-pre .big { font: 600 1.3em/1.15 var(--f-ui); letter-spacing: -0.02em; }
.plate-pre .small { font-size: .82em; color: var(--ink-2); display: flex; align-items: center; gap: .3em; flex-wrap: wrap; }
.plate-post { display: flex; flex-direction: column; gap: .3em; }
.plate-row { display: flex; align-items: center; justify-content: space-between; gap: .6em; min-width: 0; }
.plate-name { font: 600 1.45em/1.1 var(--f-ui); letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.plate-value { font: 500 1em/1 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plate-status { font-size: .8em; color: var(--ink-3); }
.plate-text { font-size: .7em; line-height: 1.35; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: .15em; }
.ticket.gold .plate-text { color: #7A6338; }
.plate-status.is-new { color: var(--accent-ink); font-weight: 600; }
.plate-in { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }

.ticket.gold { background: linear-gradient(165deg, #FFFCF4, #FBF1DC); box-shadow: var(--shadow), 0 0 0 1px #E2C27E; }
.ticket.gold .t-head { color: #6E4C0E; }
.ticket.gold .t-no, .ticket.gold .t-no b { color: #9A7533; }
.ticket.gold .plate-pre .big, .ticket.gold .plate-name, .ticket.gold .plate-value { color: #2A1E08; }
.ticket.gold .plate-pre .small, .ticket.gold .plate-status { color: #7A6338; }
.ticket.gold .t-perf::before { border-color: #E2C27E; }
.ticket.gold .foil:not(.gone) { filter: sepia(.9) saturate(2.1) hue-rotate(-8deg) brightness(1.03); }

.pill { --r: var(--r-gewoehnlich); display: inline-flex; align-items: center; gap: .45em; font: 500 .74em/1 var(--f-ui); color: var(--ink-2); white-space: nowrap; }
.pill::before { content: ""; width: .6em; height: .6em; border-radius: 50%; background: var(--r); flex: none; }
.ticket.gold .pill { color: #6E5524; }
[data-rarity="gewoehnlich"] { --r: var(--r-gewoehnlich); }
[data-rarity="ungewoehnlich"] { --r: var(--r-ungewoehnlich); }
[data-rarity="selten"] { --r: var(--r-selten); }
[data-rarity="episch"] { --r: var(--r-episch); }
[data-rarity="legendaer"] { --r: var(--r-legendaer); }
[data-rarity="mythisch"] { --r: var(--r-mythisch); }
.pill[data-rarity="mythisch"]::before { background: conic-gradient(#1FA3A8, #8150C4, #C9861A, #1FA3A8); }

.actions { flex: none; display: flex; flex-direction: column; align-items: center; }
.btn-next { width: 100%; max-width: 400px; height: 52px; border: 0; border-radius: 12px; background: var(--field); color: var(--ink-3); font: 600 1rem/1 var(--f-ui); }
.buy { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
.buy-btn { height: 56px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font: 600 1rem/1 var(--f-ui); transition: transform .12s ease; }
.buy-btn small { display: inline-flex; align-items: center; gap: 5px; font: 500 .92rem/1 var(--f-mono); }
.buy-btn:active:not(:disabled) { transform: scale(.985); }
.buy-btn.gold { background: linear-gradient(120deg, #C89A45, #E6C77F 50%, #C08C33); color: #2A1E08; }
.buy-btn.gold .coin circle:first-child { fill: #8A6420; }
.buy-btn:disabled { opacity: .35; cursor: default; }

/* ---------- Tabs ---------- */
.tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px 8px 6px; border-top: 1px solid var(--line); background: var(--bg); }
.tab { border: 0; background: transparent; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 .72rem/1 var(--f-ui); color: var(--ink-3); position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab .dot { position: absolute; top: 7px; left: calc(50% + 8px); width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }

/* ---------- Museum ---------- */
.m-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px; }
.m-head h1 { margin: 0; font: 600 2rem/1 var(--f-ui); letter-spacing: -0.04em; }
.m-head p { margin: 6px 0 0; color: var(--ink-2); font-size: .9rem; }
.m-actions { display: flex; gap: 6px; flex: none; }
.icon-btn { height: 38px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--field); display: inline-flex; align-items: center; gap: 6px; font: 500 .85rem/1 var(--f-ui); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.primary { background: var(--accent); color: var(--on-accent); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 12px; padding: 4px 0 2px; }
.stat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stat-label { font-size: .78rem; color: var(--ink-3); }
.stat-value { font: 600 1.5rem/1 var(--f-ui); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value small { font: 500 .85rem/1 var(--f-ui); color: var(--ink-3); letter-spacing: 0; }
.stat .bar { margin-top: 4px; }
.sortbar { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.sortbar::-webkit-scrollbar { display: none; }
.sort { flex: none; border: 0; background: transparent; border-radius: 8px; height: 34px; padding: 0 12px; font: 500 .86rem/1 var(--f-ui); color: var(--ink-2); }
.sort[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 14px; }
.item { --r: var(--r-gewoehnlich); border: 0; background: transparent; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; position: relative; min-width: 0; }
.item-art { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; position: relative; overflow: hidden;
  background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, color-mix(in srgb, var(--r) 6%, #F6F6F4) 60%, color-mix(in srgb, var(--r) 14%, #EEEEEB) 100%); }
.item-art img { position: absolute; inset: 0; margin: auto; width: 70%; height: 70%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(20,20,25,.16)); pointer-events: none; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
@media (hover: hover) { .item:not(.unknown):hover .item-art img { transform: scale(1.05); } }
.item-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 0 2px; }
.item-nr { font: 400 .7rem/1 var(--f-mono); color: var(--ink-3); letter-spacing: .02em; }
.item-name { font: 600 .98rem/1.2 var(--f-ui); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; }
.item-foot .pill { font-size: 11px; }
.item-value { font: 400 .76rem/1 var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count { position: absolute; top: 8px; right: 8px; min-width: 26px; height: 22px; padding: 0 7px; border-radius: 6px; background: rgba(21,22,25,.82); color: #fff; font: 500 .72rem/22px var(--f-mono); text-align: center; }
.item.unknown { cursor: default; }
.item.unknown .item-art { background: var(--sunken); }
.qmark { font: 500 1.6rem/1 var(--f-mono); color: var(--ink-3); opacity: .7; }
.item.unknown .item-name { color: var(--ink-3); font-weight: 500; }
.m-note { color: var(--ink-3); font-size: .82rem; text-align: center; margin: 4px 0 0; }

/* ---------- Werkstatt & Abzeichen ---------- */
.mtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--field); border-radius: 12px; }
.mtab { position: relative; height: 38px; border: 0; border-radius: 9px; background: transparent; font: 600 .92rem/1 var(--f-ui); color: var(--ink-2); }
.mtab[aria-pressed="true"] { background: var(--surface); color: var(--accent-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.mtab .dot { position: absolute; top: 8px; right: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.m-part { display: flex; flex-direction: column; gap: 20px; }
.ws { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.ws-bench { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.ws-slot { border: 0; background: var(--field); border-radius: 14px; padding: 12px 8px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
.ws-slot:active { transform: scale(.985); }
.ws-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-3); font-size: .85rem; }
.ws-empty svg { width: 26px; height: 26px; color: var(--accent); }
.ws-art { --r: var(--r-gewoehnlich); width: 88px; height: 88px; border-radius: 12px; position: relative; overflow: hidden; display: block; flex: none;
  background: radial-gradient(circle, #fff 0%, color-mix(in srgb, var(--r) 12%, #F3F1F2) 100%); }
.ws-art img { position: absolute; inset: 0; margin: auto; width: 82%; height: 82%; object-fit: contain; }
.ws-name { font-weight: 600; font-size: .9rem; text-align: center; overflow-wrap: anywhere; }
.ws-plus { font: 500 1.4rem/1 var(--f-ui); color: var(--ink-3); }
.ws-msg { font-size: .9rem; color: var(--ink-2); background: var(--field); border-radius: 10px; padding: 10px 12px; }
.riddles { display: flex; flex-direction: column; gap: 8px; }
.riddle { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.riddle .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.riddle q { font: 500 1rem/1.35 var(--f-ui); font-style: italic; color: var(--ink); quotes: "« " " »"; }
.riddle small { font-size: .78rem; color: var(--accent-ink); }
.badge-mini { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--accent-ink); font: 600 1.1rem/1 var(--f-mono); }
.riddle-name { font-weight: 600; font-size: .82rem; color: var(--ink-2); letter-spacing: .02em; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 18px 10px; }
.badge { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.badge b { font-weight: 600; font-size: .85rem; overflow-wrap: anywhere; }
.badge-art { width: 84px; height: 84px; border-radius: 50%; position: relative; display: grid; place-items: center; }
.badge.got .badge-art img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
.badge-art img, .badge-mini img { width: 100%; height: 100%; object-fit: contain; }
img.auto-grey, .badge.locked .badge-art img.auto-grey { filter: grayscale(1) contrast(.85); opacity: .5; }
.badge.locked.hinted .badge-art::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--accent); }
.badge.locked b { color: var(--ink-3); font-weight: 600; }
.badge.locked.hinted b { color: var(--accent-ink); }
.badge-q { font: 500 1.6rem/1 var(--f-mono); color: var(--ink-3); }
.hinted .badge-q { color: var(--accent-ink); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 10px; margin-top: 14px; }
.pick { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .82rem; font-weight: 500; text-align: center; min-width: 0; overflow-wrap: anywhere; }
.badge-hero { width: 180px; height: 180px; margin: 4px auto 12px; }
.badge-hero img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 16px rgba(0,0,0,.2)); }
.badge-hero.pop { animation: badgePop .7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes badgePop { from { transform: scale(.3) rotate(-25deg); opacity: 0; } }
.badge-combo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
.badge-combo > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .85rem; font-weight: 500; max-width: 110px; text-align: center; }
.badge-combo .ws-art { width: 72px; height: 72px; }

/* ---------- Blätter ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,10,12,.42); z-index: 40; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0 auto; max-width: 560px; max-height: 90%;
  background: var(--bg); border-radius: 20px 20px 0 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 10px 18px calc(24px + env(safe-area-inset-bottom, 0px)); animation: up .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes up { from { transform: translateY(30%); opacity: 0; } }
.grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 0 auto 14px; }
.sheet h2 { margin: 0; font: 600 1.45rem/1.15 var(--f-ui); letter-spacing: -0.03em; padding-right: 44px; }
.sheet h3 { margin: 0; font: 600 1rem/1.2 var(--f-ui); }
.sheet-close { position: absolute; z-index: 5; top: 12px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--field); display: grid; place-items: center; color: var(--ink-2); }
.sheet-close svg { width: 14px; height: 14px; }
.sheet .section { background: var(--surface); border-radius: 14px; padding: 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.detail-art { --r: var(--r-gewoehnlich); aspect-ratio: 1.3; max-width: 100%; border-radius: 16px; display: grid; place-items: center; margin: 4px 0 16px; position: relative; overflow: hidden;
  background: radial-gradient(circle at 50% 48%, #FFFFFF 0%, color-mix(in srgb, var(--r) 7%, #F7F7F5) 50%, color-mix(in srgb, var(--r) 18%, #EDEDEA) 100%); }
.detail-art img { position: absolute; inset: 0; margin: auto; width: 62%; height: 78%; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(20,20,25,.18)); }
.detail-art .rays { display: none; }
.label-card { display: flex; flex-direction: column; gap: 6px; }
.label-card .pill { font-size: .85rem; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; margin-top: 16px; }
.fact { background: var(--surface); padding: 11px 13px; display: flex; flex-direction: column; gap: 4px; }
.fact span { font-size: .74rem; color: var(--ink-3); }
.fact b { font: 500 .92rem/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }

  background: var(--ink); color: var(--on-ink); padding: 11px 16px; border-radius: 10px; font-weight: 500; font-size: .9rem;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center; animation: fade .2s ease both; }

/* Wortliste */
.wl-theme { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
.wl-theme h3 { display: flex; justify-content: space-between; align-items: baseline; }
.wl-theme h3 small { font: 400 .78rem/1 var(--f-mono); color: var(--ink-3); }
.wl { background: var(--surface); border-radius: 12px; overflow: hidden; }
.wl-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; width: 100%; background: none; border: 0; text-align: left; font-size: .93rem; }
.wl-row + .wl-row { border-top: 1px solid var(--line); }
.wl-row .fr { font-weight: 600; flex: 1; min-width: 0; }
.wl-row .de { color: var(--ink-2); flex: 1; min-width: 0; text-align: right; }
.wl-row.locked .fr, .wl-row.locked .de { color: var(--ink-3); font-weight: 400; }
.boxdots { display: inline-flex; gap: 2px; flex: none; }
.boxdots i { width: 5px; height: 5px; border-radius: 50%; background: var(--sunken); }
.boxdots i.on { background: var(--brass); }
.boxdots.master i { background: var(--ok); }
.del { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--field); display: grid; place-items: center; flex: none; color: var(--ink-2); }
.del svg { width: 12px; height: 12px; }

/* Kuratieren */
.drop { position: relative; display: grid; place-items: center; aspect-ratio: 1.5; max-width: 100%; border-radius: 14px; cursor: pointer; overflow: hidden;
  background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line-2); transition: box-shadow .15s ease; }
.drop.over { box-shadow: inset 0 0 0 2px var(--accent); }
.drop.has { background-color: #fff; background-image: conic-gradient(#EEE 25%, #FFF 0 50%, #EEE 0 75%, #FFF 0); background-size: 18px 18px; box-shadow: inset 0 0 0 1px var(--line); }
.drop img { position: absolute; inset: 0; margin: auto; max-width: 78%; max-height: 82%; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(20,20,25,.16)); }
.drop-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-2); font-size: .9rem; text-align: center; padding: 16px; }
.drop-empty svg { width: 28px; height: 28px; color: var(--ink-3); }
.check { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--ink); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { --r: var(--r-gewoehnlich); height: 40px; border: 0; border-radius: 10px; background: var(--field); display: flex; align-items: center; justify-content: center; gap: 7px; font: 500 .85rem/1 var(--f-ui); color: var(--ink-2); }
.seg button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--r); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); }
.cur-list { display: flex; flex-direction: column; }
.cur-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.cur-row + .cur-row { border-top: 1px solid var(--line); }
.cur-thumb { --r: var(--r-gewoehnlich); width: 48px; height: 48px; border-radius: 10px; flex: none; position: relative; overflow: hidden;
  background: radial-gradient(circle, #fff 0%, color-mix(in srgb, var(--r) 14%, #F0F0EE) 100%); }
.cur-thumb img { position: absolute; inset: 0; margin: auto; width: 80%; height: 80%; object-fit: contain; }
.cur-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.odds td:nth-child(n+2), .odds th:nth-child(n+2) { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

@media (max-width: 440px) { .chip .wide { display: none; } }

<script>
(() => {
"use strict";

/* ---------------- Seltenheiten ---------------- */
const RARITIES = [
  { id: "gewoehnlich",   name: "Gewöhnlich",   chance: 50 },
  { id: "ungewoehnlich", name: "Ungewöhnlich", chance: 28 },
  { id: "selten",        name: "Selten",       chance: 15 },
  { id: "episch",        name: "Episch",       chance: 5 },
  { id: "legendaer",     name: "Legendär",     chance: 1.8 },
  { id: "mythisch",      name: "Mythisch",     chance: 0.2, priceless: true }
];
const RANK = Object.fromEntries(RARITIES.map((r, i) => [r.id, i]));
const RBY = Object.fromEntries(RARITIES.map(r => [r.id, r]));

// Fundstücke kommen aus katalog.json (wird beim Veröffentlichen aus dem Ordner „fundstuecke“ erzeugt)
let CATALOG = [];
let BY_ID = {};
function setCatalog(list) {
  CATALOG = (list || []).filter(it => it && it.id && it.name && RBY[it.rarity]).map(it => ({
    id: String(it.id), nr: Math.max(0, Math.floor(Number(it.nr) || 0)), name: String(it.name),
    rarity: it.rarity, value: Math.max(0, Number(it.value) || 0), text: String(it.text || ""), image: String(it.image || ""),
    weight: Number(it.weight) > 0 ? Math.min(1, Number(it.weight)) : 1
  }));
  BY_ID = Object.fromEntries(CATALOG.map(it => [it.id, it]));
}
// Bildpfade relativ zur App auflösen (Pages CMS speichert sie teils mit führendem „/“)
const imgSrc = it => !it.image ? "" : /^(https?:|data:)/.test(it.image) ? it.image : it.image.replace(/^\/+/, "");
const isPriceless = it => !!RBY[it.rarity].priceless;

/* ---------------- Formatierung ---------------- */
const fmtInt = new Intl.NumberFormat("de-DE");
const fmtCompact = new Intl.NumberFormat("de-DE", { notation: "compact", compactDisplay: "short", maximumFractionDigits: 1 });
function fmtEur(v) {
  if (v >= 1e6) return fmtCompact.format(v) + " €";
  return fmtInt.format(Math.round(v)) + " €";
}
const valueLabel = it => isPriceless(it) ? "∞ · Unbezahlbar" : fmtEur(it.value);
const fmtDate = ts => new Date(ts).toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" });
const pad6 = n => String(n).padStart(6, "0");

/* ---------------- Spielstand (getrennt vom Katalog) ---------------- */
/* Entwicklermodus: 5× aufs Logo tippen, PIN eingeben. Nutzt einen eigenen Test-Spielstand. */
const DEV_KEY = "rubbelmuseum.dev", DEV_DAY_KEY = "rubbelmuseum.dev.day", DEV_PIN = "1604";
const DEV = (() => { try { return localStorage.getItem(DEV_KEY) === "1"; } catch (e) { return false; } })();
const DEV_DAY = DEV ? (() => { try { return Math.max(0, Math.floor(Number(localStorage.getItem(DEV_DAY_KEY)) || 0)); } catch (e) { return 0; } })() : 0;
const SAVE_KEY = DEV ? "rubbelmuseum.save.dev" : "rubbelmuseum.save";
const PREF_KEY = "rubbelmuseum.prefs";
function blankSave() {
  return { schema: 2, created: Date.now(), seq: 0, items: {}, current: null,
    coins: 0, badges: {}, learn: { w: {}, custom: [] }, streak: { count: 0, last: -9 }, daily: { day: -9, done: false, practice: false, ok: 0, earned: 0 }, round: null };
}
const num = (v, d = 0) => (typeof v === "number" && isFinite(v)) ? v : d;

function normalizeSave(raw) {
  if (!raw || typeof raw !== "object" || typeof raw.items !== "object" || raw.items === null) return null;
  const s = blankSave();
  s.created = Number(raw.created) || Date.now();
  s.seq = Math.max(0, Math.floor(Number(raw.seq) || 0));
  for (const [id, e] of Object.entries(raw.items)) {
    const n = Math.floor(Number(e && e.n));
    if (!id || !(n > 0)) continue;
    // Unbekannte IDs (z. B. aus neueren Katalogen) bleiben erhalten.
    s.items[id] = { n, first: Number(e.first) || Date.now(), last: Number(e.last) || Number(e.first) || Date.now() };
  }
  const c = raw.current;
  if (c && typeof c.itemId === "string") s.current = { seq: Number(c.seq) || s.seq, itemId: c.itemId, saved: !!c.saved, isNew: !!c.isNew, gold: !!c.gold };
  // Lernen (ab Schema 2)
  s.coins = Math.max(0, Math.round(num(raw.coins) * 100) / 100);
  s.updated = num(raw.updated);
  if (raw.badges && typeof raw.badges === "object") for (const [id, v] of Object.entries(raw.badges)) if (id) s.badges[id] = { at: num(v && v.at, Date.now()) };
  const L = raw.learn || {};
  if (L.w && typeof L.w === "object") for (const [id, st] of Object.entries(L.w)) {
    if (!st || typeof st !== "object") continue;
    s.learn.w[id] = { b: Math.max(0, Math.min(5, Math.floor(num(st.b)))), due: num(st.due), last: num(st.last, -9), lastBad: num(st.lastBad, -9), intro: num(st.intro), ok: num(st.ok), bad: num(st.bad) };
  }
  if (Array.isArray(L.custom)) s.learn.custom = L.custom.filter(c => c && typeof c.id === "string" && typeof c.fr === "string" && typeof c.de === "string").map(c => ({ id: c.id, fr: c.fr, de: c.de }));
  if (raw.streak) s.streak = { count: Math.max(0, Math.floor(num(raw.streak.count))), last: num(raw.streak.last, -9) };
  if (raw.daily) s.daily = { day: num(raw.daily.day, -9), done: !!raw.daily.done, practice: !!raw.daily.practice, ok: num(raw.daily.ok), earned: num(raw.daily.earned) };
  const r = raw.round;
  if (r && Array.isArray(r.qs) && r.qs.length && Array.isArray(r.ans)) s.round = r;
  return s;
}

let storageOk = true;
function loadSave() {
  try {
    const txt = localStorage.getItem(SAVE_KEY);
    if (txt) { const s = normalizeSave(JSON.parse(txt)); if (s) return s; }
  } catch (e) { storageOk = false; }
  const fresh = blankSave();
  if (DEV) fresh.coins = 1000;
  return fresh;
}
let warned = false;
function persist() {
  if (saveLocked) return;
  save.updated = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); storageOk = true; }
  catch (e) { storageOk = false; if (!warned) { warned = true; toast("Speichern ist in diesem Browser gerade nicht möglich."); } }
}
function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; } }
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

let save = loadSave();
let catalogReady = false;
// Lokal sichern, ohne den Stand als „neuer“ zu markieren (beim Verlassen der Seite)
let saveLocked = false; // beim Zurücksetzen: nichts mehr zurückschreiben, bevor die Seite neu lädt
function persistLocal() { if (saveLocked) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const prefs = Object.assign({ sort: "neu", autoSpeak: true }, loadPrefs());
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------------- Ziehung ---------------- */
function rand() {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; } catch (e) { return Math.random(); }
}
function pickWeighted(list, w) {
  const total = list.reduce((s, x) => s + w(x), 0);
  let r = rand() * total;
  for (const x of list) { r -= w(x); if (r < 0) return x; }
  return list[list.length - 1];
}
// Goldlos: nie Gewöhnlich, doppelte Chance auf Selten und besser
const tierWeight = (r, gold) => r.chance * (gold && RANK[r.id] >= 2 ? 2 : 1);
function drawTiers(gold) {
  let tiers = RARITIES.filter(r => CATALOG.some(it => it.rarity === r.id));
  if (gold) { const t2 = tiers.filter(r => RANK[r.id] >= 1); if (t2.length) tiers = t2; }
  return tiers;
}
function drawItem(gold) {
  // 1. Stufe nach fester Chance ziehen (leere Stufen fallen weg, bis Objekte existieren)
  const tiers = drawTiers(gold);
  const tier = pickWeighted(tiers, r => tierWeight(r, gold));
  // 2. Objekt innerhalb der Stufe, nach wirksamer Häufigkeit (siehe itemOdds)
  const odds = itemOdds(gold);
  const pool = CATALOG.filter(it => it.rarity === tier.id);
  return pickWeighted(pool, it => odds[it.id].w);
}
// Chance jedes Fundstücks. Innerhalb einer Stufe sind alle gleich häufig, außer die Häufigkeit ist
// heruntergesetzt. Untergrenze: Ein heruntergesetztes Stück wird nie seltener als das seltenste Stück
// der nächsthöheren Stufe; nötigenfalls wird seine Häufigkeit angehoben (höchstens bis „normal“).
function itemOdds(gold) {
  const tiers = drawTiers(gold), sum = tiers.reduce((a, r) => a + tierWeight(r, gold), 0);
  const res = {};
  let floor = 0;
  for (const r of tiers.slice().sort((a, b) => RANK[b.id] - RANK[a.id])) {
    const T = tierWeight(r, gold) / sum;
    const pool = CATALOG.filter(it => it.rarity === r.id);
    const ws = pool.map(it => it.weight || 1);
    const pAt = f => T * f / ws.reduce((a, w) => a + Math.max(w, f), 0);
    let f = 0;
    if (floor > 0 && Math.min(...ws) < 1) {
      if (pAt(1) <= floor) f = 1;
      else if (pAt(Math.min(...ws)) < floor) { let lo = 0, hi = 1; for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (pAt(m) < floor) lo = m; else hi = m; } f = hi; }
    }
    const eff = ws.map(w => Math.max(w, f)), tot = eff.reduce((a, x) => a + x, 0);
    pool.forEach((it, i) => { res[it.id] = { p: T * eff[i] / tot, w: eff[i], raised: eff[i] > ws[i] + 1e-9 }; });
    if (pool.length) floor = Math.min(...pool.map(it => res[it.id].p));
  }
  return res;
}
// Tatsächliche Chancen je Stufe und je Fundstück, für normales Los und Goldlos
function computeOdds() {
  const out = { tier: { normal: {}, gold: {} }, item: { normal: {}, gold: {} }, raised: { normal: {}, gold: {} } };
  for (const [key, gold] of [["normal", false], ["gold", true]]) {
    const tiers = drawTiers(gold), sum = tiers.reduce((a, r) => a + tierWeight(r, gold), 0);
    for (const r of tiers) out.tier[key][r.id] = tierWeight(r, gold) / sum;
    const odds = itemOdds(gold);
    for (const [id, o] of Object.entries(odds)) { out.item[key][id] = o.p; out.raised[key][id] = o.raised; }
  }
  return out;
}

/* ---------------- Rubbelschicht ---------------- */
const SIZE = 600, BRUSH = 54, GRID = 60, CELL = SIZE / GRID, THRESHOLD = 0.65;
const $ = id => document.getElementById(id);
const foil = $("foil"), dctx = foil.getContext("2d");
const maskC = document.createElement("canvas"); maskC.width = maskC.height = SIZE;
const mctx = maskC.getContext("2d");
const silverC = document.createElement("canvas"); silverC.width = silverC.height = SIZE;
const covered = new Uint8Array(GRID * GRID);
let clearedCells = 0;

function buildSilver() {
  const c = silverC.getContext("2d");
  const g = c.createLinearGradient(0, 0, SIZE, SIZE);
  g.addColorStop(0, "#B4B8BF"); g.addColorStop(.18, "#E4E6E9"); g.addColorStop(.38, "#BEC2C8");
  g.addColorStop(.55, "#F1F2F4"); g.addColorStop(.74, "#AEB3BA"); g.addColorStop(1, "#D3D6DA");

    c.lineWidth = .6 + rand() * .9;

  }

  c.font = "800 21px 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif";
  c.textAlign = "center"; c.textBaseline = "middle";
  const word = "RUBBELMUSEUM  ✦  ";

    const y = row * 46, off = (row % 2) * 90;
    const line = word.repeat(6);
    c.fillStyle = "rgba(255,255,255,.55)"; c.fillText(line, off - 1, y - 1);
    c.fillStyle = "rgba(70,74,82,.16)"; c.fillText(line, off + 1, y + 1);
  }
  c.restore();
  // Münze in der Mitte
  const cx = SIZE / 2, cy = SIZE / 2;
  c.lineWidth = 7;
  c.strokeStyle = "rgba(255,255,255,.7)"; c.beginPath(); c.arc(cx - 1.5, cy - 1.5, 74, 0, Math.PI * 2); c.stroke();
  c.strokeStyle = "rgba(70,74,82,.22)"; c.beginPath(); c.arc(cx + 1.5, cy + 1.5, 74, 0, Math.PI * 2); c.stroke();
  c.font = "800 92px 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif";
  c.fillStyle = "rgba(255,255,255,.75)"; c.fillText("?", cx - 2, cy + 2);
  c.fillStyle = "rgba(70,74,82,.26)"; c.fillText("?", cx + 2, cy + 6);
  // Körnung
  const img = c.getImageData(0, 0, SIZE, SIZE), d = img.data;

    d[i] += n; d[i + 1] += n; d[i + 2] += n + 1.5;
  }

  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(40,44,52,.18)");

let sheenStart = -1, light = null, raf = 0;
const SHEEN_MS = 1150;
function render(now) {
  dctx.globalCompositeOperation = "copy";
  dctx.drawImage(maskC, 0, 0);
  dctx.globalCompositeOperation = "source-in";
  dctx.drawImage(silverC, 0, 0);
  dctx.globalCompositeOperation = "source-atop";
  if (sheenStart >= 0) {
    const p = -0.25 + ((now - sheenStart) / SHEEN_MS) * 1.5;
    const g = dctx.createLinearGradient(0, 0, SIZE, SIZE);
    const st = (o, col) => { const t = p + o; if (t > 0 && t < 1) g.addColorStop(t, col); };
    g.addColorStop(0, "rgba(255,255,255,0)");
    st(-0.16, "rgba(255,255,255,0)"); st(-0.04, "rgba(255,255,255,.45)"); st(0, "rgba(255,255,255,.75)");
    st(0.03, "rgba(200,225,255,.35)"); st(0.12, "rgba(255,255,255,0)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    dctx.fillStyle = g; dctx.fillRect(0, 0, SIZE, SIZE);
  }
  if (light) {
    const r = dctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, 170);
    r.addColorStop(0, "rgba(255,255,255,.32)"); r.addColorStop(1, "rgba(255,255,255,0)");
    dctx.fillStyle = r; dctx.fillRect(0, 0, SIZE, SIZE);
  }
  dctx.globalCompositeOperation = "source-over";
}
function tick(now) {
  raf = 0;
  if (sheenStart >= 0 && now - sheenStart > SHEEN_MS) sheenStart = -1;
  render(now);
  if (sheenStart >= 0) schedule();
}
function schedule() { if (!raf) raf = requestAnimationFrame(tick); }

function resetMask() {
  mctx.globalCompositeOperation = "source-over";
  mctx.fillStyle = "#000"; mctx.fillRect(0, 0, SIZE, SIZE);
  covered.fill(0); clearedCells = 0; light = null;
  render(performance.now());
}

function markCells(a, b, r) {
  const minX = Math.max(0, Math.floor((Math.min(a.x, b.x) - r) / CELL)), maxX = Math.min(GRID - 1, Math.floor((Math.max(a.x, b.x) + r) / CELL));
  const minY = Math.max(0, Math.floor((Math.min(a.y, b.y) - r) / CELL)), maxY = Math.min(GRID - 1, Math.floor((Math.max(a.y, b.y) + r) / CELL));
  const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy, r2 = r * r;
  for (let gy = minY; gy <= maxY; gy++) for (let gx = minX; gx <= maxX; gx++) {
    const i = gy * GRID + gx; if (covered[i]) continue;
    const px = (gx + .5) * CELL, py = (gy + .5) * CELL;
    let t = len2 ? ((px - a.x) * dx + (py - a.y) * dy) / len2 : 0; t = Math.max(0, Math.min(1, t));
    const ex = a.x + t * dx - px, ey = a.y + t * dy - py;
    if (ex * ex + ey * ey <= r2) { covered[i] = 1; clearedCells++; }
  }
}
function scratch(a, b) {
  mctx.globalCompositeOperation = "destination-out";
  mctx.lineWidth = BRUSH; mctx.lineCap = "round"; mctx.lineJoin = "round";
  mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x + (a.x === b.x && a.y === b.y ? .01 : 0), b.y); mctx.stroke();
  markCells(a, b, BRUSH / 2);

}

let activePointer = null, lastPt = null;
function toCanvas(e) {

}
foil.addEventListener("pointerdown", e => {
  if (state !== "scratch" || activePointer !== null) return;

async function startNewTicket(gold, forcedId) {
  const forced = DEV && forcedId && BY_ID[forcedId];
  if (state === "dealing" || (state === "scratch" && !forced)) return;
  const cost = gold ? COST.gold : COST.normal;
  if (!catalogReady) return;
  if (!forced && !canAfford(cost)) { toast("Nicht genug Münzen. Im Lernen-Tab verdienst du neue."); return; }
  const prev = state;
  state = "dealing";
  if (!forced) addCoins(-cost);
  setButton(false);
  activePointer = null;
  if (prev === "revealed" && !reduceMotion) {
    await ticketEl.animate([{ transform: "none", opacity: 1 }, { transform: "translateX(-38%) rotate(-7deg)", opacity: 0 }],
      { duration: 230, easing: "cubic-bezier(.5,0,.8,.4)", fill: "forwards" }).finished.catch(() => {});
  }
  const it = forced || drawItem(gold);
  save.seq += 1;
  save.current = { seq: save.seq, itemId: it.id, saved: false, gold: !!gold };
  persist(); // Los ist festgelegt — Neuladen zieht nicht neu
  showPlatePre(gold);
  await prepareTicket(it, save.seq, false, gold);
  state = "scratch";
  updateActions();
  if (!reduceMotion) {
    await ticketEl.animate([{ transform: "translateX(40%) rotate(6deg)", opacity: 0 }, { transform: "none", opacity: 1 }],

    ticketEl.getAnimations().forEach(a => a.cancel());

}

  cur.isNew = entry.n === 0;

  const known = CATALOG.filter(it => DEV || save.items[it.id]);
  const unknown = CATALOG.filter(it => !DEV && !save.items[it.id]).sort((a, b) => a.nr - b.nr);
  const val = it => isPriceless(it) ? Infinity : it.value;
  const sorters = {
    neu: (a, b) => ((save.items[b.id] || {}).last || 0) - ((save.items[a.id] || {}).last || 0) || a.nr - b.nr,
    wert: (a, b) => val(b) - val(a) || a.name.localeCompare(b.name, "de"),
    selten: (a, b) => RANK[b.rarity] - RANK[a.rarity] || val(b) - val(a),
    name: (a, b) => a.name.localeCompare(b.name, "de")
  };
  known.sort(sorters[prefs.sort] || sorters.neu);
  const nr = it => "Nr. " + String(it.nr || 0).padStart(3, "0");
  $("grid").innerHTML = known.map(it => {
    const e = save.items[it.id] || { n: 0 };
    return `<button class="item" data-rarity="${it.rarity}" data-id="${esc(it.id)}" aria-label="${esc(it.name)}, ${RBY[it.rarity].name}, ${e.n} Stück">
      <div class="item-art"><img src="${esc(imgSrc(it))}" alt="" loading="lazy" draggable="false">${e.n > 1 ? `<span class="count">×${e.n}</span>` : ""}</div>
      <div class="item-body"><span class="item-nr">${nr(it)}</span><span class="item-name">${esc(it.name)}</span>
      <div class="item-foot"><span class="pill" data-rarity="${it.rarity}">${RBY[it.rarity].name}</span><span class="item-value">${esc(valueLabel(it))}</span></div></div></button>`;
  }).join("") + unknown.map(it => `<div class="item unknown" data-rarity="${it.rarity}" aria-label="Unbekanntes Objekt, ${RBY[it.rarity].name}">
      <div class="item-art"><span class="qmark">?</span></div>
      <div class="item-body"><span class="item-nr">${nr(it)}</span><span class="item-name">Noch nicht entdeckt</span>
      <div class="item-foot"><span class="pill" data-rarity="${it.rarity}">${RBY[it.rarity].name}</span><span class="item-value"></span></div></div></div>`).join("");
  const missing = unknown.length;
  $("m-note").textContent = missing ? `Noch ${missing} ${missing === 1 ? "Vitrine" : "Vitrinen"} leer.` : "Alle Vitrinen sind gefüllt.";
  museumDirty = false;
}

const closeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
function openSheet(html, label) {
  const root = $("sheet-root");
  root.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab"></div><button class="sheet-close" data-close aria-label="Schließen">${closeIcon}</button>${html}</div>`;
  root.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", closeSheet));
  root.querySelector(".sheet-close").focus();
  return root.querySelector(".sheet");
}
function closeSheet() { $("sheet-root").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function openDetail(id) {
  const it = BY_ID[id], found = save.items[id];
  if (!it || (!found && !DEV)) return;
  const e = found || { n: 0 };
  const total = isPriceless(it) ? "∞" : fmtEur(it.value * e.n);
  const sheet = openSheet(`
    <div class="detail-art" data-rarity="${it.rarity}"><img src="${esc(imgSrc(it))}" alt="${esc(it.name)}"></div>
    <div class="label-card">
      <span class="pill" data-rarity="${it.rarity}">${RBY[it.rarity].name}</span>
      <h2>${esc(it.name)}</h2>
      ${it.text ? `<p>${esc(it.text)}</p>` : ""}

    <div class="facts">
      <div class="fact"><span>Wert pro Stück</span><b>${esc(valueLabel(it))}</b></div>
      <div class="fact"><span>Im Museum</span><b>${e.n}×</b></div>
      <div class="fact"><span>Gesamtwert</span><b>${total}</b></div>
      <div class="fact"><span>Inventar</span><b>Nr. ${String(it.nr || 0).padStart(3, "0")}</b></div>

      <div class="fact"><span>Zuletzt</span><b>${found ? fmtDate(e.last) : "–"}</b></div>
    </div>
    ${DEV ? `<div class="section"><h3>Test</h3><p>Legt genau dieses Fundstück unter die Rubbelfläche. Kostet keine Münzen.</p>

`, it.name);

}

/* ---------------- Sicherung ---------------- */
function exportCode() {
  const json = JSON.stringify({ app: "rubbelmuseum", schema: 2, exported: Date.now(), save });
  return "RM1:" + btoa(unescape(encodeURIComponent(json)));
}
function parseBackup(text) {
  text = String(text || "").trim();
  if (!text) throw new Error("Es wurde kein Code eingefügt.");
  let obj;
  try {
    if (text.startsWith("RM1:")) obj = JSON.parse(decodeURIComponent(escape(atob(text.slice(4).replace(/\s+/g, "")))));
    else obj = JSON.parse(text);
  } catch (e) { throw new Error("Das ist keine gültige Rubbelmuseum-Sicherung. Prüfe, ob der Code vollständig kopiert ist."); }
  const s = normalizeSave(obj && obj.save ? obj.save : obj);
  if (!s) throw new Error("Die Datei enthält keinen Spielstand.");
  return s;
}

function openBackup() {
  const t = totals();
  const code = exportCode();
  const sheet = openSheet(`
    <h2>Sicherung</h2>
    <p style="margin-top:6px">Dein Spielstand (Museum, Münzen, Streak und Lernfortschritt) liegt nur auf diesem Gerät, in diesem Browser. Mit einer Sicherung kannst du ihn aufbewahren oder auf ein anderes Gerät mitnehmen.</p>
    <div class="section">
      <h3>Sicherung erstellen</h3>
      <p>${fmtInt.format(t.finds)} Funde · ${fmtCoin(save.coins)} Münzen · ${Object.keys(save.learn.w).length} Wörter gelernt · Stand ${fmtDate(Date.now())}</p>
      <div class="row">
        <button class="btn" id="bk-file">Datei sichern</button>
        <button class="btn secondary" id="bk-copy">Code kopieren</button>
      </div>
      <textarea id="bk-code" class="code" readonly aria-label="Sicherungscode">${esc(code)}</textarea>
    </div>
    <div class="section">
      <h3>Sicherung laden</h3>
      <p>Datei wählen oder Sicherungscode einfügen. Der aktuelle Spielstand wird dabei ersetzt.</p>
      <textarea id="bk-in" class="code" placeholder="RM1:…" aria-label="Sicherungscode einfügen"></textarea>
      <div class="row">
        <button class="btn secondary" id="bk-pick">Datei wählen</button>
        <button class="btn" id="bk-load">Code laden</button>
      </div>
      <div id="bk-confirm"></div>
    </div>`, "Sicherung");

  sheet.querySelector("#bk-copy").addEventListener("click", () => {
    const ta = sheet.querySelector("#bk-code");
    const fallback = () => { ta.focus(); ta.select(); toast("Code markiert. Jetzt kopieren."); };
    try { navigator.clipboard.writeText(code).then(() => toast("Sicherungscode kopiert"), fallback); } catch (e) { fallback(); }
  });
  sheet.querySelector("#bk-file").addEventListener("click", async () => {
    const name = `rubbelmuseum-${new Date().toISOString().slice(0, 10)}.json`;
    const json = JSON.stringify({ app: "rubbelmuseum", schema: 2, exported: Date.now(), save }, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    // Im Claude-Viewer: Download über die Plattform
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) {
        try { await dl.save({ filename: name, data: json }); toast("Sicherung gespeichert"); }
        catch (e) { if (!e || e.code !== "declined") toast("Datei geht hier nicht. Nutze „Code kopieren“."); }
        return;
      }
    } catch (e) {}
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Rubbelmuseum-Sicherung" }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Falls kein Download startet: „Code kopieren“ nutzen.");
    } catch (e) { toast("Datei geht hier nicht. Nutze „Code kopieren“."); }
  });

  const confirmBox = sheet.querySelector("#bk-confirm");
  const askReplace = s => {
    const n = Object.values(s.items).reduce((a, e) => a + e.n, 0);
    confirmBox.innerHTML = `<div class="confirm">Aktuellen Spielstand (${fmtInt.format(t.finds)} Funde) durch die Sicherung mit ${fmtInt.format(n)} Funden ersetzen?
      <div class="row"><button class="btn danger" id="bk-yes">Ersetzen</button><button class="btn secondary" id="bk-no">Abbrechen</button></div></div>`;
    confirmBox.querySelector("#bk-no").addEventListener("click", () => confirmBox.innerHTML = "");
    confirmBox.querySelector("#bk-yes").addEventListener("click", () => {
      save = s; persist(); closeSheet(); museumDirty = true; renderMuseum(); updateProgressChip(); updateCoinUI(); restoreRound(); renderLearn(); toast("Sicherung geladen");
    });
  };
  const tryText = text => { try { askReplace(parseBackup(text)); } catch (e) { confirmBox.innerHTML = `<div class="confirm">${esc(e.message)}</div>`; } };
  sheet.querySelector("#bk-load").addEventListener("click", () => tryText(sheet.querySelector("#bk-in").value));
  sheet.querySelector("#bk-pick").addEventListener("click", () => {
    const fi = $("file-in"); fi.value = "";
    fi.onchange = () => { const f = fi.files && fi.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => tryText(rd.result); rd.readAsText(f); };
    fi.click();
  });
}
$("btn-backup").addEventListener("click", openBackup);

let toastTimer = 0;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

// Ein Spieltag beginnt um 18:00 Uhr (daher +6 Stunden: 18 Uhr zählt schon als nächster Tag)
const RESET_HOUR = 18;
function today() { const d = new Date(Date.now() + (24 - RESET_HOUR) * 3600000); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) + DEV_DAY; }
function streakCurrent() { const t = today(), s = save.streak; return (s.last === t || s.last === t - 1) ? s.count : 0; }
function streakForToday() { const t = today(), s = save.streak; return s.last === t ? s.count : s.last === t - 1 ? s.count + 1 : 1; }
const multFor = n => Math.min(2, 1 + 0.01 * Math.max(0, n - 1));

const INTERVAL = [0, 1, 2, 4, 8, 16];
const W = () => save.learn.w;
function introduced() { return WORDS.filter(w => W()[w.id]); }
function pickNew(n, exclude) {
  const out = [];
  for (const w of WORDS) { if (out.length >= n) break; if (!W()[w.id] && !(exclude && exclude.has(w.id))) out.push(w.id); }
  return out;
}
function applyResult(id, ok) {
  const t = today();
  let st = W()[id];
  if (!st) st = W()[id] = { b: 0, due: t, last: -9, lastBad: -9, intro: t, ok: 0, bad: 0 };
  const first = st.last !== t;
  if (ok) {
    st.ok++;
    if (st.b === 0) { st.b = 1; st.due = t + 1; }
    else if (first) { st.due = t + (st.b === 5 ? 32 : INTERVAL[st.b + 1]); st.b = Math.min(5, st.b + 1); }
  } else { st.bad++; st.b = 1; st.due = t + 1; st.lastBad = t; }
  st.last = t;
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const randDir = () => rand() < .5 ? "fr2de" : "de2fr";
function makeQs(mcIds, writeIds) {
  const qs = shuffle([...mcIds.map(w => ({ w, t: "mc" })), ...writeIds.map(w => ({ w, t: "write" }))]);
  // Ein Wort erst auswählen, dann schreiben
  for (let i = 0; i < qs.length; i++) if (qs[i].t === "write") {
    const j = qs.findIndex((q, k) => k > i && q.t === "mc" && q.w === qs[i].w);
    if (j > i) [qs[i], qs[j]] = [qs[j], qs[i]];
  }
  // Gleiches Wort nicht direkt hintereinander (wenn möglich)
  for (let i = 1; i < qs.length; i++) if (qs[i].w === qs[i - 1].w) {
    const j = qs.findIndex((q, k) => k > i && q.w !== qs[i - 1].w && !(q.t === "write" && qs.slice(0, i).every(p => p.w !== q.w) && mcIds.includes(q.w)));
    if (j > i) { const [q] = qs.splice(j, 1); qs.splice(i, 0, q); }
  }
  for (const q of qs) { q.d = randDir(); if (q.t === "mc") q.opts = makeOptions(q.w, q.d); }
  return diversify(qs);
}
// Ersetzt einzelne Fragen durch andere Aufgabentypen. Leichte Fragen (1 Münze) bleiben leicht, schwere (3) bleiben schwer.
function diversify(qs) {
  const t = today();
  const known = id => !!(W()[id] && W()[id].b >= 1);
  // Nur Auswahlfragen zu bekannten Wörtern ersetzen (keine neuen Wörter, keine Sätze)
  // Wiederholungen, die dadurch ausfallen, bleiben fällig und kommen in der nächsten Runde
  const replaceable = i => qs[i].t === "mc" && WORD[qs[i].w] && !WORD[qs[i].w].phrase && known(qs[i].w);
  // Sätze werden gebaut statt geschrieben
  // (sehr kurze Sätze mit bis zu 3 Wörtern werden weiter geschrieben)
  for (const q of qs) if (q.t === "write" && WORD[q.w] && WORD[q.w].phrase && phraseTokens(WORD[q.w].fr).length > 3) { q.t = "order"; q.d = "de2fr"; }
  // Paare zuordnen (höchstens 1 pro Runde)
  const pool = WORDS.filter(w => !w.phrase && known(w.id));
  let idx = qs.findIndex((q, i) => replaceable(i));
  if (idx >= 0 && pool.length >= 6 && rand() < 0.6) {
    const keys = w => [...alts(w.fr), ...alts(w.de)].map(k => splitArt(looseKey(k), "de").core.replace(/^(le|la|les) |^l'/, ""));
    const first = WORD[qs[idx].w], ids = [first.id], taken = new Set(keys(first));
    const cand = shuffle(pool.slice()).sort((a, b) => W()[a.id].b - W()[b.id].b);
    for (const w of cand) { if (ids.length >= 5) break; const ks = keys(w); if (!ids.includes(w.id) && !ks.some(k => taken.has(k))) { ks.forEach(k => taken.add(k)); ids.push(w.id); } }
    if (ids.length === 5) qs[idx] = { t: "pairs", w: first.id, ids, lf: shuffle(ids.slice()), rd: shuffle(ids.slice()) };
  }
  // Lückensatz mit Verb (höchstens 1 pro Runde, nur bekannte Verben)
  const gaps = GAPS.map((g, i) => i).filter(i => known("b:" + GAPS[i].v));
  idx = qs.findIndex((q, i) => replaceable(i));
  if (idx >= 0 && gaps.length && rand() < 0.6) {
    const gi = gaps[Math.floor(rand() * gaps.length)], g = GAPS[gi];
    qs[idx] = { t: "gap", w: "b:" + g.v, g: gi, opts: shuffle([g.a, ...shuffle([...new Set(CONJ[g.v])].filter(f => f !== g.a)).slice(0, 3)]) };
  }
  // Artikel üben (höchstens 2 pro Runde)
  let n = 0;
  qs.forEach((q, i) => { if (n < 2 && replaceable(i) && artInfo(WORD[q.w]) && rand() < 0.45) { q.t = "art"; q.opts = ["le", "la", "les"]; n++; } });
  // Wörter für „Sätze bauen“ mischen
  for (const q of qs) if (q.t === "order") {
    const toks = phraseTokens(WORD[q.w].fr);
    let mix = toks.map((_, i) => i);
    for (let k = 0; k < 6; k++) { shuffle(mix); if (toks.length < 2 || mix.some((v, i) => toks[v] !== toks[i])) break; }
    q.toks = mix.map(i => toks[i]);
  }
  return qs;
}
function makeOptions(id, d) {
  const w = WORD[id], side = d === "fr2de" ? "de" : "fr";
  // Keine Ablenker, die eine Bedeutung mit dem Zielwort (oder untereinander) teilen
  const keys = x => [...alts(x.fr), ...alts(x.de)].map(k => { const l = looseKey(k); return splitArt(l, "de").core.replace(/^(le|la|les) |^l'/, ""); });
  const taken = new Set(keys(w));
  const pick = list => { const out = []; for (const x of shuffle(list.slice())) { if (out.length >= 3) break; const ks = keys(x); if (x.id !== id && !ks.some(k => taken.has(k))) { ks.forEach(k => taken.add(k)); out.push(x.id); } } return out; };
  let opts = pick(WORDS.filter(x => x.theme === w.theme));
  if (opts.length < 3) opts = opts.concat(pick(WORDS.filter(x => !opts.includes(x.id)))).slice(0, 3);
  return shuffle([id, ...opts]);
}

function buildDaily() {
  const t = today();
  const known = introduced().map(w => w.id).filter(id => W()[id].b >= 1);
  const due = known.filter(id => W()[id].due <= t).sort((a, b) => W()[a].b - W()[b].b || W()[a].due - W()[b].due);
  const notDue = known.filter(id => W()[id].due > t).sort((a, b) => W()[a].due - W()[b].due || W()[a].b - W()[b].b);
  const nNew = known.length === 0 ? 5 : due.length >= 8 ? 1 : due.length >= 5 ? 2 : 3;
  const fresh = pickNew(nNew);
  const review = [...due, ...notDue];
  const writes = review.slice(0, 5);
  const mcs = fresh.slice(0, 5);
  let ri = writes.length;
  while (mcs.length < 5 && ri < review.length) mcs.push(review[ri++]);
  // noch Platz: bekannte Wörter dürfen in derselben Runde auch gewählt werden
  for (let k = 0; mcs.length < 5 && k < writes.length; k++) if (!mcs.includes(writes[k])) mcs.push(writes[k]);
  if (mcs.length < 5) { const more = pickNew(5 - mcs.length, new Set(fresh)); mcs.push(...more); fresh.push(...more); }
  for (let k = 0; writes.length < 5 && fresh.length; k++) writes.push(fresh[k % fresh.length]);
  const all = WORDS.map(w => w.id);
  while (mcs.length < 5) mcs.push(all[Math.floor(rand() * all.length)]);
  while (writes.length < 5) writes.push(mcs[writes.length % mcs.length]);
  return { kind: "daily", day: t, mult: multFor(streakForToday()), qs: makeQs(mcs, writes), i: 0, ans: [], earned: 0 };
}
function buildPractice() {
  const t = today();
  const intro = introduced().map(w => w.id);
  const st = id => W()[id];
  const order = [
    ...intro.filter(id => st(id).lastBad === t),
    ...intro.filter(id => st(id).intro === t && st(id).lastBad !== t),
    ...intro.filter(id => st(id).last === t && st(id).intro !== t && st(id).lastBad !== t),
    ...intro.filter(id => st(id).last !== t).sort((a, b) => st(a).b - st(b).b || st(a).due - st(b).due)
  ];
  const ids = [...new Set(order)].slice(0, 10);
  while (ids.length < 10 && ids.length) ids.push(ids[ids.length % Math.max(1, new Set(ids).size)]);
